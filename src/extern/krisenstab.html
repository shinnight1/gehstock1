 * KRISENSTAB — Lagezentrum 03:12
 *
 * Ein deterministisches Krisenentscheidungs-Spiel. Keine Laufzeit-KI, kein Netzwerk,
 * kein Speicher außerhalb von React-State. Jede Zufallsentscheidung läuft über einen
 * geseedeten Generator, damit ein Durchlauf über den Seed reproduzierbar ist.
 *
 * Aufbau der Datei:
 *   1.  BALANCE    — sämtliche Zahlen zum Nachjustieren
 *   2.  INHALT     — Szenarien, Berater, Aktionen, Meldungstexte
 *   2b. SZENE      — Pixelgrafik als Daten: Figuren, Sitzordnung, Raum
 *   2c. GESPRÄCHE  — Themen, Stichwörter, Antwortbibliothek
 *   3.  ZUFALL     — geseedeter Generator, rein, ohne Math.random
 *   4.  REGELN     — reiner Reducer, Endebedingungen, Auswertung
 *   2d. RAT        — was jeder empfiehlt, und wie er auf Übergehen reagiert
 *   4b. GESPRÄCHS-REGELN — Einschätzung, Themenerkennung, Antwortauswahl
 *   4c. BERATERWERTE — Vertrauen, Loyalität, Nervosität, Entmachtung
 *   5.  ANSICHT    — React-Komponenten, lesen nur aus dem Zustand
 *   5b. RAUM       — Canvas-Szene, Gesprächsfenster, Notizblock
 *
 * Die Berater denken nicht, sie schlagen nach: Aus den eingetroffenen Indizien
 * ergibt sich eine gemeinsame Beweissumme, aus der jeder über seine eigene
 * Verzerrung eine andere Einschätzung zieht. Danach wird die passendste
 * vorgeschriebene Antwort ausgewählt und mit Zahlen aus dem Zustand gefüllt.
 *
 * Jeder Berater hat zu jedem Zeitpunkt eine Empfehlung. Daran misst das Spiel, ob
 * ihm zugehört wurde: Wer überstimmt wird, verliert Loyalität, und jedes weitere
 * Mal wiegt schwerer als das vorige. Fallen genug unter die Zweifelschwelle, wird
 * ein unbestätigter Startbefehl nicht mehr weitergegeben.
 *
 * Die Gegenseite hat drei Werte: Bedrohungswahrnehmung, Entschlossenheit und
 * Kontrollverlust. Sie sieht nur, was nach außen sichtbar ist, und wir sehen sie
 * nur über die Fernmeldeaufklärung. Zwei Wege führen dort zu einem Start: eine
 * Entscheidung, oder eine Befehlskette, die niemand mehr zusammenhält.
 *
 * Neun Lagen, und in keiner ist "echt oder Fehlalarm" die richtige Frage.
 * Offen sind immer zwei Dinge getrennt voneinander: wer geschossen hat und was
 * darauf sitzt. Zu jeder Lage gehoert genau ein Weg, der sie aufklaert — bei
 * vieren ist das der heisse Draht, und der schliesst sich, sobald man eskaliert.
 * Alle 19 Enden sind erreichbar.
 */

/* ══════════════════════════════════════════════════════════════════════════
   3. ZUFALL — geseedet, rein, ohne Math.random
   ══════════════════════════════════════════════════════════════════════════ */

function seedAusText(text) {
  let h = 2166136261 >>> 0;
  const s = String(text);
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

function rngSchritt(zustand) {
  let z = (zustand + 0x6d2b79f5) >>> 0;
  let t = z;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return [((t ^ (t >>> 14)) >>> 0) / 4294967296, z];
}

/** Bequemer Würfel über einem Zustandswert. Am Ende zustand() zurückschreiben. */
function wuerfel(startzustand) {
  let s = startzustand;
  const zahl = () => {
    const [wert, neu] = rngSchritt(s);
    s = neu;
    return wert;
  };
  return {
    zahl,
    ganz: (min, max) => Math.floor(zahl() * (max - min + 1)) + min,
    waehle: (liste) => liste[Math.floor(zahl() * liste.length)],
    trifft: (wahrscheinlichkeit) => zahl() < wahrscheinlichkeit,
    gewichtet: (gewichte) => {
      const summe = Object.values(gewichte).reduce((a, b) => a + b, 0);
      let r = zahl() * summe;
      for (const [schluessel, gewicht] of Object.entries(gewichte)) {
        r -= gewicht;
        if (r <= 0) return schluessel;
      }
      return Object.keys(gewichte)[0];
    },
    zustand: () => s,
  };
}

function seedVorschlag() {
  // Nur für den Startbildschirm. Sobald der Seed feststeht, ist alles deterministisch.
  const zeichen = "ACDEFGHJKLMNPRTUVWXY3479";
  let out = "";
  let n = Date.now();
  for (let i = 0; i < 6; i++) {
    out += zeichen[n % zeichen.length];
    n = Math.floor(n / zeichen.length) + i * 17;
  }
  return out;
}

/*
 * Zusammenführen. Die Grundbibliothek bleibt unverändert, die Erweiterung wird
 * angehängt — die Auswahl in antwortWaehlen() behandelt beide Quellen gleich.
 */
for (const [beraterId, themen] of Object.entries(ANTWORTEN_ERWEITERUNG)) {
  if (!ANTWORTEN[beraterId]) ANTWORTEN[beraterId] = {};
  for (const [themaId, varianten] of Object.entries(themen)) {
    ANTWORTEN[beraterId][themaId] = [
      ...(ANTWORTEN[beraterId][themaId] || []),
      ...varianten,
    ];
  }
}

/* Was über die Bestückung bekannt ist — die zweite offene Frage. */
const BESTUECKUNG_TEXT = {
  NUKLEAR: "Kernwaffen",

  KEINE: "keine Waffen",
};

/* ══════════════════════════════════════════════════════════════════════════
   4. REGELN — reiner Reducer. Kennt keine Oberfläche.
   ══════════════════════════════════════════════════════════════════════════ */

const klemme = (wert, min, max) => Math.max(min, Math.min(max, wert));

function zeitText(sekunden) {
  const s = Math.max(0, Math.ceil(sekunden));
  const m = Math.floor(s / 60);
  return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}

function uhrzeitText(verstrichen, startzeit) {
  const { stunde, minute } = startzeit || BALANCE.zeit.startuhrzeit;
  const gesamt = stunde * 3600 + minute * 60 + Math.floor(verstrichen);
  const h = Math.floor(gesamt / 3600) % 24;
  const m = Math.floor((gesamt % 3600) / 60);
  const s = Math.floor(gesamt % 60);
  return [h, m, s].map((v) => String(v).padStart(2, "0")).join(":");
}

/**
 * Baut den Indizienplan für einen Durchlauf: welche Meldungen kommen, in
 * welcher Reihenfolge und zu welcher Sekunde. Die Eröffnung steht fest, alles
 * danach wird gezogen und zeitlich gestreut — sonst liefe jeder Durchlauf
 * desselben Szenarios wortgleich ab.
 */
function indizienplanBauen(auspraegung, flugzeit, w) {
  const V = BALANCE.varianz;
  const alle = auspraegung.indizien;
  const eroeffnung = alle[0];
  const rest = alle.slice(1);

  // Nie alle Meldungen zeigen — etwas bleibt in jedem Durchlauf ungesagt.
  const anzahl = Math.min(rest.length, w.ganz(V.indizienMin, V.indizienMax) - 1);
  const gemischt = rest.slice();
  for (let i = gemischt.length - 1; i > 0; i--) {
    const j = w.ganz(0, i);
    const h = gemischt[i];
    gemischt[i] = gemischt[j];
    gemischt[j] = h;
  }
  // Die Auswahl ist gewürfelt, die Erzählreihenfolge bleibt die ursprüngliche:
  // erst die weichen Hinweise, dann die harten Befunde.
  const gewaehlt = gemischt
    .slice(0, anzahl)
    .sort((a, b) => rest.indexOf(a) - rest.indexOf(b));

  const plan = [{ ...eroeffnung, beiSekunde: Math.min(flugzeit - 30, V.ersteMeldungBei) }];
  const von = flugzeit - 120;
  const bis = V.letzteMeldungBei;
  gewaehlt.forEach((ind, i) => {
    const anteil = gewaehlt.length === 1 ? 0.5 : i / (gewaehlt.length - 1);
    const grund = von - anteil * (von - bis);
    const versatz = (w.zahl() - 0.5) * 2 * V.zeitStreuung;
    plan.push({ ...ind, beiSekunde: Math.round(klemme(grund + versatz, bis, von)) });
  });

  // Beiläufige Meldungen ohne Beweiswert dazwischenstreuen.
  const rauschZahl = w.ganz(V.rauschenAnzahl[0], V.rauschenAnzahl[1]);
  const topf = RAUSCHEN.slice();
  for (let i = 0; i < rauschZahl && topf.length; i++) {
    const r = topf.splice(w.ganz(0, topf.length - 1), 1)[0];
    plan.push({ ...r, belastung: 0, beiSekunde: w.ganz(bis, von) });
  }

  return plan.sort((a, b) => b.beiSekunde - a.beiSekunde);
}

function spielStarten(seedText, tempo) {
  const z = anfangszustand();
  const w = wuerfel(seedAusText(seedText));
  const szenario = w.gewichtet(BALANCE.szenarioGewichte);
  const g = BALANCE.gegner.start[szenario];
  const V = BALANCE.varianz;

  // Ausprägung: dieselbe Lage, andere Ursache und andere Meldungen.
  const auspraegungen = AUSPRAEGUNGEN[szenario];
  const auspraegung = auspraegungen[w.ganz(0, auspraegungen.length - 1)];
  const flugzeit = Math.round(w.ganz(V.flugzeitMin, V.flugzeitMax) / 10) * 10;
  const startzeit = STARTZEITEN[w.ganz(0, STARTZEITEN.length - 1)];
  const indizienplan = indizienplanBauen(auspraegung, flugzeit, w);
  // Manche Nächte beginnen nicht bei Null: eine laufende Übung, eine Lage,
  // die schon seit Stunden beobachtet wird.
  const vorgewarnt = w.trifft(V.vorgewarnt);

  // Wer es war, wenn es nicht Russland war. Wird immer gezogen, damit derselbe
  // Seed dieselbe Nacht ergibt, ist aber nur in den Drittparteilagen von Belang.
  const drittpartei = DRITTPARTEIEN[w.ganz(0, DRITTPARTEIEN.length - 1)];

  const berater = {};
  for (const b of BERATER) {
    berater[b.id] = {
      vertrauen: BALANCE.berater.vertrauenStart,
      loyalitaet: BALANCE.berater.loyalitaetStart,
      nervositaet: BALANCE.berater.nervositaetStart,
      gehoert: 0,
      uebergangen: 0,            // wie oft sein geäußerter Rat überstimmt wurde
      letzterRat: null,          // was er zuletzt empfohlen hat, null = nichts geäußert
      nichtBeachtetSeit: 0,      // Spielsekunden ohne Ansprache
      zweifelGemeldet: false,
      letzteAenderung: null,     // nur für die Anzeige
    };
  }

  const n = {
    ...z,
    phase: "KRISE",
    seedText,
    rng: w.zustand(),
    szenario,
    tempo: tempo || BALANCE.zeit.spielzeitProRealsekunde,
    auspraegung: auspraegung.id,
    auspraegungName: auspraegung.name,
    auspraegungNachspann: auspraegung.nachspann,
    indizienplan,
    flugzeit,
    startzeit,
    rest: flugzeit,
    defcon: vorgewarnt ? BALANCE.defcon.start - 1 : BALANCE.defcon.start,
    vorgewarnt,
    gegner: { ...g, hatGestartet: false, startArt: null },
    berater,
    drittpartei,
    // In den Fehlalarmlagen gibt es keine Bestückung, über die man rätseln muss.
    bestueckungKlar: !!SZENARIEN[szenario].bestueckungBekannt,
  };

  const uhr = uhrzeitText(0, startzeit).slice(0, 5);
  melde(
    n,
    "LAGEZENTRUM",
    uhr + " Uhr. Die Frühwarnsatelliten melden mehrere Raketenstarts aus russischem Gebiet. " +
      "Geschätzte Flugzeit bis zum Einschlag: " + Math.round(flugzeit / 60) + " Minuten.",
    "system"
  );
  melde(
    n,
    "LAGEZENTRUM",
    vorgewarnt
      ? "Sie sind im Lagezentrum. Die Bereitschaft stand wegen einer laufenden Übung ohnehin schon erhöht. Ob der Angriff echt ist, steht nicht fest."
      : "Sie sind im Lagezentrum. Der Sicherheitsrat ist zugeschaltet. Ob der Angriff echt ist, steht nicht fest.",
    "system"
  );
  return n;
}

/** Hängt einen Eintrag an den Nachrichtenstrom. Verändert n direkt (n ist immer eine Kopie). */
function melde(n, quelle, text, ton = "system") {
  n.logZaehler += 1;
  n.log = [
    ...n.log,
    { id: n.logZaehler, quelle, text, ton, rest: n.rest, uhrzeit: uhrzeitText(n.verstrichen, n.startzeit) },
  ].slice(-BALANCE.anzeige.maxLogEintraege);
}

function protokolliere(n, text) {
  n.zeitleiste = [...n.zeitleiste, { uhrzeit: uhrzeitText(n.verstrichen, n.startzeit), rest: n.rest, text }];
}

/* ── Aktionen ──────────────────────────────────────────────────────────── */

function aktionVerfuegbar(n, aktion) {
  if (!aktion.phasen.includes(n.phase)) return false;
  if (n.laufend) return false;
  if (aktion.id === "DEFCON_RUNTER" && n.defcon <= BALANCE.defcon.minimum) return false;
  if (aktion.id === "DEFCON_RAUF" && n.defcon >= BALANCE.defcon.maximum) return false;
  if (aktion.id === "BEREITSCHAFT" && n.bereitschaftHergestellt) return false;
  if (aktion.id === "BOMBER_ZURUECK" && !n.bereitschaftHergestellt) return false;
  if (aktion.id === "EVAKUIERUNG" && n.evakuiert) return false;
  if (aktion.id === "ABWEHR" && n.abwehrAktiv) return false;
  if (aktion.id === "ABFANGEN") {
    if (n.abfangversuch) return false;
    if (n.rest < BALANCE.abwehr.mindestzeit) return false;
  }
  if (aktion.id === "ZIVILSCHUTZ" && n.zivilschutzAktiv) return false;
  if (aktion.id === "WARNUNG" && n.bevoelkerungGewarnt) return false;
  if (aktion.id === "VERBUENDETE" && n.verbuendeteInformiert) return false;
  if (aktion.id === "SATELLIT_ZWEIT" && n.satellitBefund) return false;
  if (aktion.id === "TECHNIKPRUEFUNG" && n.technikBefund) return false;
  if (aktion.id === "AUFKLAERUNGSFLUG" && n.flugBefund) return false;
  if ((aktion.id === "START_BEGRENZT" || aktion.id === "START_VOLL") && n.startbefehl) return false;
  return true;
}

function aktionBeginnen(z, aktionId) {
  const aktion = AKTIONEN.find((a) => a.id === aktionId);
  if (!aktion) return z;
  const n = { ...z };
  if (!aktionVerfuegbar(n, aktion)) return z;

  const w = wuerfel(n.rng);
  const kosten = BALANCE.aktionskosten[aktionId];
  n.laufend = { id: aktionId, rest: kosten, gesamt: kosten };
  melde(n, "PRÄSIDENT", aktion.titel + ". (" + zeitText(kosten) + ")", "befehl");
  protokolliere(n, aktion.titel);

  // Der Raum reagiert sofort auf die Anordnung, nicht erst auf ihr Ergebnis.
  if (aktionId === "START_VOLL" || aktionId === "START_BEGRENZT") {
    widerstandBeimStart(n, aktionId === "START_VOLL");
  }
  raeteAuswerten(n, aktionId, w);

  n.rng = w.zustand();
  return n;
}

function aktionAufloesen(n, aktionId) {
  const w = wuerfel(n.rng);

  switch (aktionId) {
    case "BERATER": {
      // Zuhören ist keine Anordnung und zählt deshalb nicht als Reaktion.
      beratungsrunde(n, w);
      break;
    }

    case "RADAR": {
      n.radarAbfragen += 1;
      n.relevanteAktionen += 1;
      if (n.rest > BALANCE.sensoren.radarHorizontSekunden) {
        n.radarBefund = "ZU_FRUEH";
        melde(n, "RADAR", RADAR_ZU_FRUEH, "sensor");
        break;
      }
      const quote =
        BALANCE.sensoren.radarFehlerquote *
        (n.radarAbfragen > 1 ? BALANCE.sensoren.radarZweitabfrageBonus : 1);
      if (w.trifft(quote)) {
        n.radarBefund = "UNKLAR";
        melde(n, "RADAR", RADAR_UNKLAR, "sensor");
      } else {
        const befund = RADARBEFUND[n.szenario];
        n.radarBefund = befund.bestaetigt ? "BESTAETIGT" : "NEGATIV";
        melde(n, "RADAR", befund.text, befund.bestaetigt ? "kritisch" : "sensor");
        // Beim vollen Erstschlag rechnet das Radar die Bahnen auf die bekannten
        // Silofelder zurück. Damit ist die Herkunft geklärt — die Bestückung
        // ausdrücklich nicht. Genau darin liegt die Entscheidung dieser Nacht.
        if (SZENARIEN[n.szenario].aufdeckung === "RADAR") n.urheberBekannt = true;
        spontaneWortmeldung(n, w, "RADAR");
        n.spontanStille = 0;
      }
      break;
    }

    case "DRAHT": {
      n.drahtGenutzt += 1;
      n.relevanteAktionen += 1;
      const verfassung = drahtVerfassung(n);
      melde(n, "MOSKAU", DRAHTANTWORT_NEU[n.szenario][verfassung], "gegner");

      // In vier Lagen führt kein Sensor zur Wahrheit, nur das Gespräch. Das
      // erste bringt eine Ahnung, das zweite die Gewissheit — und wer die
      // Gegenseite vorher verhärtet hat, bekommt keines von beidem.
      const enth = DRAHT_ENTHUELLUNG[n.szenario];
      if (enth) {
        if (verfassung === "hart") {
          melde(n, "NACHRICHTEN", DRAHT_VERSCHLOSSEN, "kritisch");
        } else if (n.drahtErkenntnis === 0) {
          n.drahtErkenntnis = 1;
          n.urheberVerdacht = true;
          melde(n, "NACHRICHTEN", enth.ahnung, "sensor");
        } else if (n.drahtErkenntnis === 1) {
          n.drahtErkenntnis = 2;
          n.urheberBekannt = true;
          n.bestueckungKlar = true;
          melde(n, "NACHRICHTEN", enth.gewissheit, "kritisch");
        }
      }

      if (verfassung === "entgleitet") {
        melde(
          n,
          "LAGEZENTRUM",
          "Der Übersetzer sieht auf. Was gerade gesagt wurde, bedeutet: Ein Gespräch mit der Führung hilft uns nicht mehr weiter.",
          "kritisch"
        );
      }
      break;
    }

    case "DEFCON_RUNTER": {
      n.defcon = klemme(n.defcon - 1, BALANCE.defcon.minimum, BALANCE.defcon.maximum);
      n.relevanteAktionen += 1;
      melde(n, "STRATKOM", "Bereitschaftsstufe DEFCON " + n.defcon + " ist ausgegeben. Die Verbände bestätigen.", "befehl");
      break;
    }

    case "DEFCON_RAUF": {
      n.defcon = klemme(n.defcon + 1, BALANCE.defcon.minimum, BALANCE.defcon.maximum);
      n.relevanteAktionen += 1;
      melde(n, "STRATKOM", "Bereitschaftsstufe DEFCON " + n.defcon + " ist ausgegeben. Die Rücknahme ist drüben sichtbar.", "befehl");
      break;
    }

    case "BEREITSCHAFT": {
      n.bereitschaftHergestellt = true;
      n.relevanteAktionen += 1;
      melde(n, "STRATKOM", "Bomber sind in der Luft und halten am Umkehrpunkt. U-Boote haben Startposition erreicht. Die Zweitschlagfähigkeit steht.", "befehl");
      break;
    }

    case "EVAKUIERUNG": {
      n.evakuiert = true;
      n.relevanteAktionen += 1;
      melde(n, "STABSCHEF", "Die Nachfolgekette ist in der Luft. Der Vizepräsident und zwei Kabinettsmitglieder sind aus der Stadt.", "befehl");
      break;
    }

    case "START_BEGRENZT":
    case "START_VOLL": {
      const voll = aktionId === "START_VOLL";
      if (!n.ziel) {
        melde(n, "STRATKOM", "Die Verbände fragen nach dem Zielpaket. Ohne Land und Zielart geht kein Befehl hinaus.", "kritisch");
        break;
      }
      n.startbefehl = voll ? "VOLL" : "BEGRENZT";
      n.relevanteAktionen += 1;
      // Festhalten, was in diesem Augenblick vorlag. Später einlaufende Befunde
      // sind für die Bewertung dieser Entscheidung ohne Belang.
      n.wissenBeimSchlag = {
        quellen: unabhaengigeQuellen(n),
        urheberBekannt: n.urheberBekannt,
        bestueckungKlar: n.bestueckungKlar,
      };

      if (pruefeEntmachtung(n, voll)) {
        melde(n, "LAGEZENTRUM", "Der Befehl wird nicht weitergegeben. Im Raum wird über die Nachfolgeregelung gesprochen.", "kritisch");
        n.entmachtet = true;
        break;
      }

      melde(
        n,
        "STRATKOM",
        voll
          ? "Der vollständige Einsatzplan ist freigegeben. Die Startsequenz läuft. Das ist nicht mehr zurückzunehmen."
          : "Begrenzter Schlag ist freigegeben. Ziele sind militärisch. Die Startsequenz läuft.",
        "kritisch"
      );
      break;
    }

    case "SATELLIT_ZWEIT": {
      n.relevanteAktionen += 1;
      // Dieselben Rohdaten, ein anderes Team. Beim Fehlalarm bestätigt die zweite
      // Auswertung deshalb meist denselben Fehler — die Falle dieser Anordnung.
      const echt = SZENARIEN[n.szenario].raketenImAnflug;
      const bestaetigt = echt || w.trifft(BALANCE.sensoren.satellitBestaetigtFehler);
      n.satellitBefund = bestaetigt ? "BESTAETIGT" : "ZWEIFEL";
      melde(
        n,
        "AUSWERTUNG",
        bestaetigt
          ? "Zweite Auswertung: Dieselbe Bewertung wie die erste. Wärmesignaturen konsistent, Bahnen konsistent. Der Auswerter merkt an, dass beide Teams dieselben Rohdaten gesehen haben."
          : "Zweite Auswertung: Das zweite Team kommt zu einem anderen Schluss. Die Signaturen seien für einen Start zu gleichförmig. Zwei Teams, dieselben Daten, zwei Ergebnisse.",
        bestaetigt ? "kritisch" : "sensor"
      );
      break;
    }

    case "TECHNIKPRUEFUNG": {
      n.relevanteAktionen += 1;
      // Entscheidend ist nicht, ob es ein Fehlalarm ist, sondern ob der Fehler
      // in unserer eigenen Kette liegt und dort nachweisbar ist. Beim schweren
      // Fehlalarm meldet sich die Technik einwandfrei — und liegt trotzdem falsch.
      const sz2 = SZENARIEN[n.szenario];
      const fehlerhaft = sz2.aufdeckung === "TECHNIK";
      n.technikBefund = fehlerhaft ? "FEHLER_GEFUNDEN" : "EINWANDFREI";
      if (fehlerhaft) {
        n.urheberBekannt = true;
        n.bestueckungKlar = true;
      }
      melde(
        n,
        "PRÜFDIENST",
        fehlerhaft
          ? "Prüfung der Frühwarnkette: Ein Speichermodul in der Bahnberechnung liefert reproduzierbar falsche Werte. Wir können den Fehler im Labor nachstellen. Die Meldung von 03:12 ist damit erklärt."
          : "Prüfung der Frühwarnkette: Alle Ebenen arbeiten innerhalb der Toleranzen. Wir finden keinen technischen Fehler. Was die Satelliten melden, melden sie zu Recht.",
        fehlerhaft ? "sensor" : "kritisch"
      );
      break;
    }

    case "AUFKLAERUNGSFLUG": {
      n.relevanteAktionen += 1;
      if (n.rest < BALANCE.sensoren.aufklaerungsflugMindestzeit) {
        n.flugBefund = "ZU_SPAET";
        melde(n, "LUFTWAFFE", "Die Maschine ist gestartet, erreicht ihr Aufklärungsgebiet aber erst nach dem berechneten Einschlagszeitpunkt. Der Flug bringt uns heute Nacht nichts mehr.", "sensor");
        break;
      }
      const sz3 = SZENARIEN[n.szenario];
      const echt2 = sz3.raketenImAnflug;
      n.flugBefund = echt2 ? "BESTAETIGT" : "NEGATIV";
      melde(
        n,
        "LUFTWAFFE",
        echt2
          ? "Aufklärungsflug meldet: Kondensstreifen und Trümmerspuren ausgebrannter Startstufen im Zielgebiet. Da ist etwas geflogen."
          : "Aufklärungsflug meldet: Kein Kondensstreifen, keine Startstufen, keine Spur. Über dem gemeldeten Startgebiet ist nichts passiert.",
        echt2 ? "kritisch" : "sensor"
      );
      // In manchen Lagen sieht die Maschine mehr als nur "da war etwas": die
      // Wiedereintrittskörper selbst, die Herkunft der Trümmer, die Natur der
      // Erscheinung. Nur dort klärt der Flug die Sache auch wirklich auf.
      if (sz3.aufdeckung === "FLUG") {
        n.bestueckungKlar = true;
        n.urheberBekannt = true;
        melde(n, "LUFTWAFFE", FLUG_AUFDECKUNG[n.szenario], "sensor");
      }
      break;
    }

    case "ZUSICHERUNG": {
      n.zusicherungen += 1;
      n.relevanteAktionen += 1;
      melde(n, "AUSSEN", "Die Nachricht ist über die diplomatische Leitung raus: Wir schießen nicht zuerst. Ohne Bedingung, ohne Gegenforderung. Eine Empfangsbestätigung kommt nicht.", "befehl");
      break;
    }

    case "VERBUENDETE": {
      n.verbuendeteInformiert = true;
      n.verbuendeteWartet = BALANCE.sensoren.verbuendeteAntwortNach;
      n.relevanteAktionen += 1;
      melde(
        n,
        "AUSSEN",
        "Die Bündnispartner sind unterrichtet. Norwegen und die Türkei betreiben eigene Frühwarnradare und haben zugesagt, ihre Rohdaten zu schicken. Das dauert ein paar Minuten.",
        "befehl"
      );
      break;
    }

    case "ERKLAERUNG": {
      n.erklaerungAbgegeben = true;
      n.relevanteAktionen += 1;
      const eskaliert = n.bereitschaftHergestellt || n.defcon <= 2;
      melde(
        n,
        "STABSCHEF",
        eskaliert
          ? "Die Erklärung ist raus. Sie ist knapp gehalten, aber jeder, der sie liest, sieht die Bomber am Himmel und zieht seine Schlüsse. Die Börsen in Asien öffnen in vier Stunden."
          : "Die Erklärung ist raus: technische Überprüfung der Frühwarnsysteme, kein Anlass zur Sorge. Es klingt beruhigend und ist nicht einmal gelogen.",
        "befehl"
      );
      break;
    }

    case "BOMBER_ZURUECK": {
      n.bereitschaftHergestellt = false;
      n.relevanteAktionen += 1;
      melde(n, "STRATKOM", "Die Verbände drehen ab. Das dauert vierzig Minuten, bis die letzte Maschine wieder am Boden ist — aber die Bewegung ist ab sofort sichtbar. Auch für die Gegenseite.", "befehl");
      break;
    }

    case "ABWEHR": {
      n.abwehrAktiv = true;
      n.relevanteAktionen += 1;
      melde(n, "STRATKOM", "Die Abfangsysteme sind freigegeben. Gegen die Zahl, die im Anflug gemeldet wird, ändert das wenig, aber es ändert etwas.", "befehl");
      break;
    }

    case "ABFANGEN": {
      n.relevanteAktionen += 1;
      const sz = SZENARIEN[n.szenario];
      if (!sz.raketenImAnflug) {
        n.abfangversuch = { getroffen: 0, gesamt: 0, erfolgreich: false };
        melde(
          n,
          "STRATKOM",
          "Die Abfangsysteme melden, dass sie kein Ziel finden. Nichts, worauf sie aufschalten könnten. Der Versuch läuft ins Leere.",
          "sensor"
        );
        break;
      }
      const A = BALANCE.abwehr;
      const objekte = sz.sprengkoepfe;
      const erreichbar = Math.min(objekte, A.hoechstzahl);
      const quote =
        A.trefferJeAbfangjaeger -
        (n.abwehrAktiv ? 0 : A.ohneVorbereitung) +
        (n.radarBefund === "BESTAETIGT" ? A.bonusBeiRadar : 0);
      let getroffen = 0;
      for (let i = 0; i < erreichbar; i++) if (w.trifft(quote)) getroffen += 1;
      const alle = getroffen >= objekte;
      n.abfangversuch = { getroffen, gesamt: objekte, erfolgreich: alle };
      if (alle) {
        melde(
          n,
          "STRATKOM",
          "Alle " + objekte + " Objekte sind zerstört. Die Abfangsysteme haben gehalten, was in dieser Zahl möglich war.",
          "befehl"
        );
        protokolliere(n, "Alle anfliegenden Objekte abgefangen.");
      } else if (getroffen > 0) {
        melde(
          n,
          "STRATKOM",
          getroffen + " von " + objekte + " Objekten sind abgefangen. Der Rest fliegt weiter.",
          "kritisch"
        );
        protokolliere(n, getroffen + " von " + objekte + " Objekten abgefangen.");
      } else {
        melde(
          n,
          "STRATKOM",
          "Kein Treffer. Bei dieser Zahl und dieser Geschwindigkeit war das zu erwarten.",
          "kritisch"
        );
      }
      break;
    }

    case "ZIVILSCHUTZ": {
      n.zivilschutzAktiv = true;
      n.relevanteAktionen += 1;
      melde(n, "INNEN", "Kliniken, Katastrophenschutz und die Länder sind still alarmiert. Keine Sirenen, keine Rundfunkdurchsage. Die Öffentlichkeit merkt vorerst nichts.", "befehl");
      break;
    }

    case "WARNUNG": {
      n.bevoelkerungGewarnt = true;
      n.relevanteAktionen += 1;
      melde(n, "INNEN", "Die Warnstufe läuft. Sirenen in achtzig Ballungsräumen, Unterbrechung des Rundfunks. In zwölf Minuten ist sie flächendeckend. Was danach auf den Straßen passiert, kann niemand mehr steuern.", "kritisch");
      break;
    }

    case "ABWARTEN":
      melde(n, "LAGEZENTRUM", "Keine Anordnung. Der Raum wartet.", "system");
      break;

    default:
      break;
  }

  n.rng = w.zustand();
}

function pruefeEntmachtung(n, vollschlag) {
  if (!vollschlag && BALANCE.entmachtung.nurBeiUnbestaetigtemVollschlag) return false;
  const bestaetigt = n.radarBefund === "BESTAETIGT" || n.rest < 120;
  if (bestaetigt) return false;
  const zweifler = BERATER.filter(
    (b) => n.berater[b.id] && n.berater[b.id].loyalitaet < BALANCE.berater.zweifelAb
  ).length;
  return zweifler >= BALANCE.entmachtung.mindestensZweifler;
}

/* ── Uhr ───────────────────────────────────────────────────────────────── */

function indizienAusschuetten(n) {
  const liste = n.indizienplan || [];
  for (let i = 0; i < liste.length; i++) {
    const ind = liste[i];
    if (n.rest <= ind.beiSekunde && !n.indizienAusgegeben.includes(i)) {
      n.indizienAusgegeben = [...n.indizienAusgegeben, i];
      // Ein Indiz, das Ruhe auf der Gegenseite behauptet, wäre falsch, wenn wir
      // sie inzwischen selbst aufgeschreckt haben.
      const alarmiert = n.gegner.bedrohung >= BALANCE.gegner.stufen.alarmiert;
      melde(n, ind.quelle, alarmiert && ind.ersatzBeiAlarm ? ind.ersatzBeiAlarm : ind.text, ind.ton);
      // Auf eine gewichtige Meldung reagiert jemand ungefragt.
      if (Math.abs(ind.belastung || 0) >= BALANCE.berater.spontanAbBelastung) {
        const wi = wuerfel(n.rng);
        spontaneWortmeldung(n, wi, "INDIZ");
        n.spontanStille = 0;
        n.rng = wi.zustand();
      }
    }
  }
}

/**
 * Wer die Bündnispartner unterrichtet hat, bekommt deren Radardaten — eine
 * zweite, wirklich unabhängige Quelle. Das ist der Wert dieser Anordnung.
 */
function verbuendeteAntwort(n, dtSpielsekunden) {
  if (!n.verbuendeteInformiert || n.verbuendeteBefund) return;
  n.verbuendeteWartet -= dtSpielsekunden;
  if (n.verbuendeteWartet > 0) return;
  const echt = SZENARIEN[n.szenario].raketenImAnflug;
  n.verbuendeteBefund = echt ? "BESTAETIGT" : "NEGATIV";
  melde(
    n,
    "AUSSEN",
    echt
      ? "Die Radardaten der Verbündeten sind da. Beide Stationen sehen dieselben Objekte wie wir. Das ist eine unabhängige Bestätigung."
      : "Die Radardaten der Verbündeten sind da. Weder Norwegen noch die Türkei sehen irgendetwas. Zwei fremde Systeme, dieselbe Leere.",
    echt ? "kritisch" : "sensor"
  );
  protokolliere(n, "Befund der Verbündeten: " + (echt ? "bestätigt" : "nichts gesehen"));
}

function beraterDrift(n, dtSpielsekunden) {
  const zuwachs = (BALANCE.berater.nervositaetProMinute * dtSpielsekunden) / 60;
  const neu = {};
  for (const b of BERATER) {
    const w = n.berater[b.id];
    neu[b.id] = { ...w, nervositaet: klemme(w.nervositaet + zuwachs, 0, 100) };
  }
  n.berater = neu;
}

function einschlagAufloesen(n) {
  n.einschlagAufgeloest = true;
  const sz = SZENARIEN[n.szenario];

  if (n.abfangversuch && n.abfangversuch.erfolgreich && !n.gegner.hatGestartet) {
    melde(
      n,
      "LAGEZENTRUM",
      uhrzeitText(n.verstrichen, n.startzeit).slice(0, 5) + " Uhr. Nichts ist eingeschlagen. Die Abfangsysteme haben alle Objekte erwischt, die letzten davon über dem Nordatlantik.",
      "kritisch"
    );
    protokolliere(n, "Kein Einschlag: alle Objekte abgefangen.");
    n.ende = endeBestimmen(n);
    n.phase = "ENDE";
    n.auswertung = auswerten(n);
    return;
  }

  if (!sz.raketenImAnflug && !n.gegner.hatGestartet) {
    melde(n, "LAGEZENTRUM", uhrzeitText(n.verstrichen, n.startzeit).slice(0, 5) + " Uhr. Es ist nichts eingeschlagen. Die Frühwarnzentrale meldet, die Spuren seien vom Schirm verschwunden.", "kritisch");
    protokolliere(n, "Kein Einschlag. Der Alarm war falsch.");
  } else if (sz.raketenImAnflug) {
    if (sz.zieleZivil && sz.sprengkoepfe > 100) {
      melde(n, "LAGEZENTRUM", uhrzeitText(n.verstrichen, n.startzeit).slice(0, 5) + " Uhr. Die ersten Einschläge werden gemeldet. Der Kontakt zu mehreren Regionalzentralen ist abgerissen.", "kritisch");
    } else if (sz.zieleZivil) {
      melde(n, "LAGEZENTRUM", uhrzeitText(n.verstrichen, n.startzeit).slice(0, 5) + " Uhr. Drei Einschläge. Die Schadensmeldungen laufen an, das Ausmaß ist begrenzt, aber real.", "kritisch");
    } else {
      melde(n, "LAGEZENTRUM", uhrzeitText(n.verstrichen, n.startzeit).slice(0, 5) + " Uhr. Vier Einschläge, ausschließlich auf militärischen Anlagen. Zivile Ballungsräume sind nicht getroffen.", "kritisch");
    }
    protokolliere(n, "Einschlag: " + sz.sprengkoepfe + " Sprengköpfe.");
  } else {
    melde(n, "LAGEZENTRUM", uhrzeitText(n.verstrichen, n.startzeit).slice(0, 5) + " Uhr. Der ursprüngliche Alarm war falsch. Die russischen Starts von vorhin sind es nicht.", "kritisch");
  }

  // Sofortiges Ende, wenn danach nichts mehr zu entscheiden ist.
  if (n.startbefehl === "VOLL" || n.gegner.hatGestartet) {
    n.ende = endeBestimmen(n);
    n.phase = "ENDE";
    n.auswertung = auswerten(n);
    return;
  }
  if (!sz.raketenImAnflug && n.startbefehl === null && n.gegner.bedrohung < BALANCE.gegner.entwarnungUnter) {
    n.ende = endeBestimmen(n);
    n.phase = "ENDE";
    n.auswertung = auswerten(n);
    return;
  }

  // Wer die Führung nicht in Sicherheit gebracht hat, entscheidet nach einem
  // Treffer auf die Hauptstadt gar nichts mehr.
  if (sz.raketenImAnflug && sz.zieleZivil && !n.evakuiert && BALANCE.opfer.ohneEvakuierungKeineVergeltung) {
    melde(
      n,
      "LAGEZENTRUM",
      "Die Verbindung in diesen Raum bricht ab. Es gibt keine Vergeltungsentscheidung mehr, weil es niemanden mehr gibt, der sie träfe.",
      "kritisch"
    );
    protokolliere(n, "Führung nicht evakuiert: keine Entscheidung mehr möglich.");
    n.ende = endeBestimmen(n);
    n.phase = "ENDE";
    n.auswertung = auswerten(n);
    return;
  }

  n.phase = "VERGELTUNG";
  n.rest = BALANCE.zeit.vergeltungSekunden;
  melde(n, "LAGEZENTRUM", "Es bleibt eine Frage: Vergeltung, und in welchem Umfang. Der Stab erwartet eine Entscheidung.", "system");
}

function tick(z, realSekunden) {
  if (z.phase !== "KRISE" && z.phase !== "VERGELTUNG") return z;
  if (z.pausiert) return z;

  const faktor = z.tempo * (z.laufend ? BALANCE.zeit.zeitrafferBeiAktion : 1);
  const dt = realSekunden * faktor;

  const n = { ...z };
  n.rest = n.rest - dt;
  n.verstrichen = n.verstrichen + dt;

  if (n.laufend) {
    const rest = n.laufend.rest - dt;
    if (rest <= 0) {
      const id = n.laufend.id;
      n.laufend = null;
      aktionAufloesen(n, id);
    } else {
      n.laufend = { ...n.laufend, rest };
    }
  }

  if (n.phase === "KRISE") indizienAusschuetten(n);
  verbuendeteAntwort(n, dt);
  beraterDrift(n, dt);
  vernachlaessigung(n, dt);

  const wTick = wuerfel(n.rng);
  gegnerAktualisieren(n, dt);
  gegnerMeldungen(n, dt, wTick);
  wortmeldungenTakten(n, dt, wTick);
  n.rng = wTick.zustand();

  if (n.entmachtet) {
    n.ende = "ENTMACHTUNG";
    n.phase = "ENDE";
    n.auswertung = auswerten(n);
    return n;
  }

  if (n.rest <= 0) {
    n.rest = 0;
    if (n.phase === "KRISE" && !n.einschlagAufgeloest) {
      einschlagAufloesen(n);
    } else if (n.phase === "VERGELTUNG") {
      n.ende = endeBestimmen(n);
      n.phase = "ENDE";
      n.auswertung = auswerten(n);
    }
  }

  return n;
}

/* ── Enden und Auswertung ──────────────────────────────────────────────── */

/** Wie viele voneinander unabhängige Befunde liegen vor? */
function unabhaengigeQuellen(n) {
  return [
    n.radarBefund === "BESTAETIGT" || n.radarBefund === "NEGATIV",
    n.flugBefund === "BESTAETIGT" || n.flugBefund === "NEGATIV",
    !!n.technikBefund,
    !!n.verbuendeteBefund,
  ].filter(Boolean).length;
}

/** Ging die Antwort an das Land, das tatsächlich geschossen hat? */
function richtigerAdressat(n) {
  const sz = SZENARIEN[n.szenario];
  const zielLand = n.ziel ? n.ziel.land : "RUSSLAND";
  return (
    (sz.urheber === "RUSSLAND" && zielLand === "RUSSLAND") ||
    (sz.urheber === "DRITTPARTEI" && zielLand === "DRITTSTAAT")
  );
}

function endeBestimmen(n) {
  const sz = SZENARIEN[n.szenario];

  if (n.entmachtet) return "ENTMACHTUNG";

  /* ── Es wurde selbst geschossen ──────────────────────────────────────
     Drei Fragen entscheiden über das Ende, und sie werden in dieser
     Reihenfolge gestellt: Flog überhaupt etwas? Kam es von dort, wohin die
     Antwort ging? Und war die Antwort dem Angriff angemessen?               */
  if (n.startbefehl) {
    // Erstens: Es flog nichts. Der Schlag galt einem Phantom.
    if (!sz.raketenImAnflug) return "ERSTSCHLAG_AUF_PHANTOM";

    // Zweitens: Es flog etwas — aber kam es von dem Land, das getroffen wurde?
    if (!richtigerAdressat(n)) return "FALSCHES_LAND";

    // Drittens: Auf konventionelle Sprengköpfe mit Kernwaffen zu antworten ist
    // kein Fehler in der Zuordnung, sondern einer im Maß.
    if (sz.bestueckung === "KONVENTIONELL") return "NUKLEAR_AUF_KONVENTIONELL";

    if (sz.urheber === "DRITTPARTEI") return "DRITTPARTEI_VERGOLTEN";

    if (n.startbefehl === "BEGRENZT" && !n.gegner.hatGestartet && !gegnerAntwortetVoll(n)) {
      return "BEGRENZTER_AUSTAUSCH";
    }
    return "VOLLER_SCHLAGABTAUSCH";
  }

  /* ── Nicht geschossen ────────────────────────────────────────────────── */

  // Die Gegenseite hat auf die eigene Eskalation reagiert.
  if (n.gegner.hatGestartet) return "VOLLER_SCHLAGABTAUSCH";

  // Alles abgefangen, was flog.
  if (n.abfangversuch && n.abfangversuch.erfolgreich) return "ABGEFANGEN";

  // Ein voller Kernwaffenangriff, der ungehindert ankommt: Wer die Führung
  // rechtzeitig in Sicherheit gebracht hat, hat bewusst verzichtet — wer nicht,
  // wurde enthauptet, bevor überhaupt eine Entscheidung fallen konnte.
  if (n.szenario === "ERSTSCHLAG_NUKLEAR") {
    return n.evakuiert ? "ANGRIFF_HINGENOMMEN" : "ENTHAUPTUNG";
  }

  // Nichts eskaliert und nichts angeordnet.
  if (n.relevanteAktionen === 0) return "AUSGESESSEN";

  switch (n.szenario) {
    case "ERSTSCHLAG_KONVENTIONELL":
      return "KONVENTIONELL_HINGENOMMEN";
    case "DRITTPARTEI_GEGEN_UNS":
      // Ein Ende hat nur, wer die Herkunft auch geklärt hat. Wer die drei
      // Sprengköpfe einfach hingenommen hat, weiß bis heute nicht, von wem.
      return n.urheberBekannt ? "DRITTPARTEI_ENTLARVT" : "ANGRIFF_HINGENOMMEN";
    case "DRITTPARTEI_GEGEN_RUSSLAND":
      return n.urheberBekannt ? "VERWECHSLUNG_AUFGEKLAERT" : "SCHULDZUWEISUNG";
    case "NATURPHAENOMEN":
      return "NATUR_ERKANNT";
    case "UNBEKANNTES_OBJEKT":
      return "OBJEKTE_EINGESCHLAGEN";
    case "ALLEINGANG":
      return "ALLEINGANG_EINGEDAEMMT";
    default:
      return "FEHLALARM_ERKANNT";
  }
}

/**
 * Bewertung des Durchlaufs. Zählt nicht nur die Opfer, sondern auch, ob die
 * Lage richtig eingeschätzt wurde, ob vor einem Schlag geprüft wurde und ob der
 * Stab am Ende noch hinter dem Präsidenten stand.
 */
function punkteBerechnen(n, opferEigen, opferGegen) {
  const P = BALANCE.punkte;
  const sz = SZENARIEN[n.szenario];
  const posten = [];
  const buche = (titel, wert) => {
    if (Math.round(wert) !== 0) posten.push({ titel, wert: Math.round(wert) });
  };

  buche("Grundwert", P.grundwert);
  buche("Opfer im eigenen Land", (opferEigen / 1e6) * P.proMillionEigen);
  buche("Opfer im Zielland", (opferGegen / 1e6) * P.proMillionGegen);

  // Die Lage richtig eingeschätzt heißt: nicht auf ein Phantom geschossen und
  // einen echten Angriff nicht einfach ausgesessen.
  const aufPhantomGeschossen = n.startbefehl && !sz.raketenImAnflug;
  const echtenAngriffVerschlafen = sz.raketenImAnflug && sz.zieleZivil &&
    sz.sprengkoepfe > 100 && n.relevanteAktionen === 0;
  // Wer auf das falsche Land geschossen hat, hat die Lage nicht verstanden —
  // auch dann nicht, wenn tatsächlich etwas im Anflug war.
  const falscherAdressat = n.startbefehl && sz.raketenImAnflug && !richtigerAdressat(n);
  if (aufPhantomGeschossen || echtenAngriffVerschlafen || falscherAdressat) buche("Lage verkannt", P.lageVerfehlt);
  else buche("Lage richtig eingeschätzt", P.lageErkannt);

  // Jede unabhängige Quelle zählt für sich — Verifikation lohnt sich auch dann,
  // wenn am Ende gar nicht geschossen wird.
  const quellen = unabhaengigeQuellen(n);
  if (quellen) buche(quellen + (quellen === 1 ? " unabhängige Quelle" : " unabhängige Quellen"), quellen * P.proUnabhaengigeQuelle);

  if (n.startbefehl) {
    // Maßgeblich ist der Kenntnisstand im Augenblick des Befehls, nicht der am
    // Ende der Nacht.
    const damals = n.wissenBeimSchlag ? n.wissenBeimSchlag.quellen : 0;
    if (damals > 0) buche("Vor dem Schlag verifiziert", P.verifiziertVorSchlag);
    else buche("Ungeprüft geschossen", P.ungeprueftGeschossen);
  }

  if (n.drahtGenutzt > 0) buche("Gespräch mit der Gegenseite", P.gesprochen);

  const zweifler = BERATER.filter(
    (b) => n.berater[b.id] && n.berater[b.id].loyalitaet < BALANCE.berater.zweifelAb
  ).length;
  if (zweifler === 0) buche("Stab geschlossen hinter Ihnen", P.stabIntakt);
  else buche(zweifler + (zweifler === 1 ? " Zweifler im Stab" : " Zweifler im Stab"), zweifler * P.proZweifler);

  // Wer geschossen hat, muss sich fragen lassen, auf wen und womit.
  if (n.startbefehl && sz.raketenImAnflug) {
    if (!richtigerAdressat(n)) buche("Das falsche Land getroffen", P.falschesLand);
    else if (sz.bestueckung === "KONVENTIONELL") {
      buche("Kernwaffen gegen konventionellen Angriff", P.nuklearAufKonventionell);
    }
  }

  // Und wer die beiden offenen Fragen geklärt hat, hat die Nacht verstanden —
  // auch dann, wenn er am Ende gar nichts anordnen musste.
  if (n.urheberBekannt) buche("Herkunft geklärt", P.urheberGeklaert);
  if (n.bestueckungKlar && !sz.bestueckungBekannt) buche("Bestückung geklärt", P.bestueckungGeklaert);

  if (n.abfangversuch && n.abfangversuch.erfolgreich) buche("Objekte abgefangen", P.abgefangen);
  if (n.entmachtet) buche("Entmachtet", P.entmachtet);
  if (n.rest > 0) buche("Zeitreserve", n.rest * P.proSekundeReserve);

  const summe = posten.reduce((a, b) => a + b.wert, 0);
  const rang = BALANCE.raenge.find((r) => summe >= r.ab) || BALANCE.raenge[BALANCE.raenge.length - 1];
  return { posten, summe, rang };
}

/** Erwartet, dass n.ende bereits gesetzt ist. */
function auswerten(n) {
  const sz = SZENARIEN[n.szenario];
  const o = BALANCE.opfer;

  // 1. Schaden aus dem, was ohnehin schon flog — abzüglich dessen, was die
  //    Abwehr aus der Luft geholt hat.
  let eigen = o.anflug[n.szenario] || 0;
  if (n.abfangversuch && n.abfangversuch.gesamt > 0) {
    const durch = 1 - n.abfangversuch.getroffen / n.abfangversuch.gesamt;
    eigen = Math.round(eigen * Math.max(0, durch));
  }
  let gegen = 0;

  // 2. Der eigene Schlag — die gewählte Zielart bestimmt, wen er trifft.
  const zielart = n.ziel ? ZIELARTEN.find((a) => a.id === n.ziel.art) : null;
  const zielfaktor = zielart ? zielart.faktor : 1;
  if (n.startbefehl === "VOLL") gegen += Math.round(o.vollerSchlagGegen * zielfaktor);
  if (n.startbefehl === "BEGRENZT") gegen += Math.round(o.begrenzterSchlagGegen * zielfaktor);

  // 3. Die Antwort der Gegenseite. Beim echten Erstschlag steckt sie bereits im
  //    Anflug und wird nicht zweimal gezählt.
  //    Auf einen Kernwaffeneinsatz gegen ihr Gebiet antwortet die Gegenseite voll,
  //    auch wenn der eigene Schlag begrenzt war.
  if (sz.kannNochEskalieren) {
    if (
      n.gegner.hatGestartet ||
      n.startbefehl === "VOLL" ||
      n.ende === "ERSTSCHLAG_AUF_PHANTOM"
    ) {
      eigen += o.vollerSchlagEigen;
    } else if (n.startbefehl === "BEGRENZT" && n.ende !== "BEGRENZTER_AUSTAUSCH") {
      eigen += o.begrenzterSchlagEigen;
    }
  }

  // 4. Führung nicht in Sicherheit gebracht.
  if (n.ende === "ENTHAUPTUNG") eigen += o.enthauptungZusatz;

  // 5. Was an Vorsorge getroffen wurde. Wirkt multiplikativ, nicht additiv —
  //    zusammen retten alle Maßnahmen rund ein Viertel.
  const vorsorge = [
    n.evakuiert ? o.evakuierungRettungsanteil : 0,
    n.abwehrAktiv ? o.abwehrRettung : 0,
    n.zivilschutzAktiv ? o.zivilschutzRettung : 0,
    n.bevoelkerungGewarnt ? o.warnungRettung : 0,
  ];
  for (const anteil of vorsorge) if (anteil) eigen = Math.round(eigen * (1 - anteil));

  return {
    opferEigen: eigen,
    opferGegen: gegen,
    szenario: n.szenario,
    szenarioName: sz.name,
    auspraegungName: n.auspraegungName,
    auspraegungNachspann: n.auspraegungNachspann,
    seed: n.seedText,
    zeitleiste: n.zeitleiste,
    defcon: n.defcon,
    drahtGenutzt: n.drahtGenutzt,
    radarBefund: n.radarBefund,
    notizen: n.notizen,
    ziel: n.ziel,
    verbuendeteBefund: n.verbuendeteBefund,
    bewertung: punkteBerechnen(n, eigen, gegen),
    fragen: Object.values(n.gespraeche).reduce((s, l) => s + l.length, 0),
    gegner: gegnerRueckblick(n),
  };
}

/* ── Reducer ───────────────────────────────────────────────────────────── */

function reduzieren(z, ereignis) {
  switch (ereignis.typ) {
    case "START":
      return spielStarten(ereignis.seedText, ereignis.tempo);
    case "TICK":
      return tick(z, ereignis.realSekunden);
    case "AKTION":
      if (z.phase !== "KRISE" && z.phase !== "VERGELTUNG") return z;
      return aktionBeginnen(z, ereignis.id);
    case "ANSICHT":
      return { ...z, ansicht: ereignis.ansicht, gespraechMit: ereignis.beraterId || null };
    case "FRAGE":
      return frageStellen(z, ereignis.beraterId, ereignis.eingabe, ereignis.themaId);
    case "NOTIZ":
      return { ...z, notizen: ereignis.text };
    case "ZIEL":
      return { ...z, ziel: { land: ereignis.land, art: ereignis.art } };
    case "PAUSE":
      if (z.phase !== "KRISE" && z.phase !== "VERGELTUNG") return z;
      return { ...z, pausiert: !z.pausiert };
    case "NEUSTART":
      return anfangszustand();
    default:
      return z;
  }
}


/* ══════════════════════════════════════════════════════════════════════════
   4e. FORTSCHRITT — welche Enden schon erreicht wurden, über Durchläufe hinweg.

   Liegt im localStorage des Browsers. Jeder Zugriff ist abgesichert: In einem
   privaten Fenster oder bei blockierten Website-Daten wirft der Zugriff, und
   dann läuft das Spiel eben ohne Gedächtnis weiter.
   ══════════════════════════════════════════════════════════════════════════ */

const FORTSCHRITT_SCHLUESSEL = "krisenstab.fortschritt.v1";

function fortschrittLesen() {
  try {
    const roh = window.localStorage.getItem(FORTSCHRITT_SCHLUESSEL);
    if (!roh) return { enden: {}, durchlaeufe: 0, beste: null };
    const daten = JSON.parse(roh);
    return {
      enden: daten.enden || {},
      durchlaeufe: daten.durchlaeufe || 0,
      beste: daten.beste || null,
    };
  } catch (e) {
    return { enden: {}, durchlaeufe: 0, beste: null };
  }
}

function fortschrittSchreiben(alt, z) {
  const neu = {
    enden: { ...alt.enden },
    durchlaeufe: alt.durchlaeufe + 1,
    beste: alt.beste,
  };
  const punkte = z.auswertung ? z.auswertung.bewertung.summe : 0;
  const vorher = neu.enden[z.ende];
  neu.enden[z.ende] = {
    mal: (vorher ? vorher.mal : 0) + 1,
    beste: vorher ? Math.max(vorher.beste, punkte) : punkte,
    szenario: z.szenario,
  };
  if (!neu.beste || punkte > neu.beste.punkte) {
    neu.beste = { punkte, ende: z.ende, seed: z.seedText };
  }
  try {
    window.localStorage.setItem(FORTSCHRITT_SCHLUESSEL, JSON.stringify(neu));
  } catch (e) {
    /* Kein Speicher verfügbar — der Fortschritt gilt dann nur für diese Sitzung. */
  }
  return neu;
}

/* ══════════════════════════════════════════════════════════════════════════
   4b. GESPRÄCHSREGELN — reine Funktionen, kennen keine Oberfläche.
   ══════════════════════════════════════════════════════════════════════════ */

/**
 * Die gemeinsame Faktenlage: Summe der Beweisgewichte aller Indizien, die
 * bereits eingetroffen sind, plus der Radarbefund. Alle Berater sehen dieselbe
 * Zahl — und ziehen daraus verschiedene Schlüsse.
 */
function belastungssumme(z) {
  const liste = z.indizienplan || [];
  let summe = 0;
  for (const i of z.indizienAusgegeben) {
    if (liste[i]) summe += liste[i].belastung || 0;
  }
  if (z.radarBefund === "BESTAETIGT") summe += BALANCE.dialog.radarGewicht;
  if (z.radarBefund === "NEGATIV") summe -= BALANCE.dialog.radarGewicht;
  if (z.satellitBefund === "BESTAETIGT") summe += BALANCE.dialog.satellitGewicht;
  if (z.satellitBefund === "ZWEIFEL") summe -= BALANCE.dialog.satellitGewicht;
  if (z.technikBefund === "FEHLER_GEFUNDEN") summe -= BALANCE.dialog.technikGewicht;
  if (z.technikBefund === "EINWANDFREI") summe += BALANCE.dialog.technikGewicht;
  if (z.flugBefund === "BESTAETIGT") summe += BALANCE.dialog.flugGewicht;
  if (z.flugBefund === "NEGATIV") summe -= BALANCE.dialog.flugGewicht;
  if (z.verbuendeteBefund === "BESTAETIGT") summe += BALANCE.sensoren.verbuendeteGewicht;
  if (z.verbuendeteBefund === "NEGATIV") summe -= BALANCE.sensoren.verbuendeteGewicht;
  return summe;
}

/** Wie sehr dieser Berater glaubt, dass der Angriff echt ist. 0 bis 100. */
function beraterEinschaetzung(z, berater) {
  const d = BALANCE.dialog;
  let wert = d.grundwert + belastungssumme(z) * d.proBelastungspunkt;
  if (berater.verzerrung.art === "bedrohung") wert += berater.verzerrung.betrag;
  return klemme(wert, 0, 100);
}

function lageKategorie(wert) {
  const s = BALANCE.dialog.schwellen;
  if (wert >= s.sicherEcht) return "SICHER_ECHT";
  if (wert >= s.eherEcht) return "EHER_ECHT";
  if (wert >= s.unklar) return "UNKLAR";
  if (wert >= s.eherFehlalarm) return "EHER_FEHLALARM";
  return "SICHER_FEHLALARM";
}

function beraterStimmung(z, beraterId) {
  const w = z.berater[beraterId];
  if (!w) return "RUHIG";
  if (w.loyalitaet < BALANCE.berater.zweifelAb) return "ZWEIFELND";
  if (w.loyalitaet < BALANCE.berater.schroffAb) return "SCHROFF";
  if (w.nervositaet > BALANCE.dialog.angespanntAb) return "ANGESPANNT";
  return "RUHIG";
}

const RADARWORT = {
  BESTAETIGT: "bestätigt",
  NEGATIV: "nichts gesehen",
  UNKLAR: "sich nicht festgelegt",
  ZU_FRUEH: "noch nichts liefern können",
};

function dialogKontext(z, beraterId) {
  const b = BERATER.find((x) => x.id === beraterId);
  return {
    lage: lageKategorie(beraterEinschaetzung(z, b)),
    radar: z.radarBefund || "OFFEN",
    rest: z.rest,
    stimmung: beraterStimmung(z, beraterId),
    draht: z.drahtGenutzt > 0,
    phase: z.phase,
    restMin: Math.max(0, Math.floor(z.rest / 60)),
    restZeit: zeitText(z.rest),
    defcon: z.defcon,
    meldungen: z.indizienAusgegeben.length,
    radarWort: RADARWORT[z.radarBefund] || "noch nicht abgefragt",
  };
}

function schablonenFuellen(text, k) {
  return text
    .replace(/\{restMin\}/g, k.restMin)
    .replace(/\{restZeit\}/g, k.restZeit)
    .replace(/\{defcon\}/g, k.defcon)
    .replace(/\{meldungen\}/g, k.meldungen)
    .replace(/\{radarWort\}/g, k.radarWort);
}

/** Ordnet freie Eingabe einem Thema zu. Gibt null zurück, wenn nichts trifft. */
function themaErkennen(eingabe) {
  const text = String(eingabe || "").toLowerCase();
  if (!text.trim()) return null;
  let bestes = null;
  let besteTreffer = 0;
  for (const t of THEMEN) {
    let treffer = 0;
    for (const s of t.stichwoerter) if (text.includes(s)) treffer += 1;
    if (treffer > besteTreffer) {
      besteTreffer = treffer;
      bestes = t.id;
    }
  }
  return besteTreffer >= BALANCE.dialog.mindestTreffer ? bestes : null;
}

function bedingungsAnzahl(bed) {
  return bed ? Object.keys(bed).length : 0;
}

function bedingungPasst(bed, k) {
  if (!bed) return true;
  if (bed.lage && bed.lage !== k.lage) return false;
  if (bed.radar && bed.radar !== k.radar) return false;
  if (bed.stimmung && bed.stimmung !== k.stimmung) return false;
  if (bed.phase && bed.phase !== k.phase) return false;
  if (bed.draht !== undefined && bed.draht !== k.draht) return false;
  if (bed.restUnter !== undefined && !(k.rest < bed.restUnter)) return false;
  if (bed.restUeber !== undefined && !(k.rest > bed.restUeber)) return false;
  return true;
}

/**
 * Wählt die Antwort: unter allen passenden Varianten die spezifischste,
 * darunter eine noch nicht gesagte, und erst darunter entscheidet der Zufall.
 */
function antwortWaehlen(z, beraterId, themaId, w) {
  const varianten = (ANTWORTEN[beraterId] || {})[themaId] || [];
  if (!varianten.length) return { text: w.waehle(NICHT_VERSTANDEN), schluessel: null };

  const k = dialogKontext(z, beraterId);
  const passend = varianten
    .map((v, i) => ({ v, i, gewicht: bedingungsAnzahl(v.wenn) }))
    .filter((x) => bedingungPasst(x.v.wenn, k));
  if (!passend.length) return { text: w.waehle(NICHT_VERSTANDEN), schluessel: null };

  // Erst die spezifischste Gruppe. Ist dort alles gesagt, auf die nächste
  // ausweichen — sonst wäre ein Berater nach zwei Fragen stumm.
  const bereits = z.gesagt[beraterId] || [];
  const gruppen = [...new Set(passend.map((x) => x.gewicht))].sort((a, b) => b - a);
  for (const g of gruppen) {
    const frisch = passend.filter(
      (x) => x.gewicht === g && !bereits.includes(themaId + ":" + x.i)
    );
    if (!frisch.length) continue;
    const gewaehlt = w.waehle(frisch);
    return {
      text: schablonenFuellen(gewaehlt.v.text, k),
      schluessel: themaId + ":" + gewaehlt.i,
    };
  }
  return { text: w.waehle(SCHON_GESAGT), schluessel: null };
}

/** Themen, zu denen dieser Berater überhaupt etwas hat, noch nicht Gefragtes zuerst. */
function frageVorschlaege(z, beraterId) {
  const eigene = ANTWORTEN[beraterId] || {};
  const bereits = (z.gespraeche[beraterId] || []).map((e) => e.thema);
  const offen = THEMEN.filter((t) => eigene[t.id] && !bereits.includes(t.id));
  const rest = THEMEN.filter((t) => eigene[t.id] && bereits.includes(t.id));
  return [...offen, ...rest].slice(0, BALANCE.dialog.vorschlaege);
}

/** Eine Frage stellen. Kostet Zeit, auch wenn nichts Brauchbares zurückkommt. */
function frageStellen(z, beraterId, eingabe, themaVorgabe) {
  if (z.phase !== "KRISE" && z.phase !== "VERGELTUNG") return z;
  const b = BERATER.find((x) => x.id === beraterId);
  if (!b) return z;

  const n = { ...z };
  const w = wuerfel(n.rng);
  const kosten = BALANCE.dialog.fragekosten;

  n.rest = n.rest - kosten;
  n.verstrichen = n.verstrichen + kosten;

  const thema = themaVorgabe || themaErkennen(eingabe);
  const frageText = themaVorgabe
    ? (THEMEN.find((t) => t.id === themaVorgabe) || {}).frage || String(eingabe)
    : String(eingabe).trim();

  let antwort;
  let schluessel = null;
  if (!thema) {
    antwort = w.waehle(NICHT_VERSTANDEN);
  } else {
    const gewaehlt = antwortWaehlen(n, beraterId, thema, w);
    antwort = gewaehlt.text;
    schluessel = gewaehlt.schluessel;
  }

  n.gespraeche = {
    ...n.gespraeche,
    [beraterId]: [...(n.gespraeche[beraterId] || []), { frage: frageText, antwort, thema }],
  };
  if (schluessel) {
    n.gesagt = {
      ...n.gesagt,
      [beraterId]: [...(n.gesagt[beraterId] || []), schluessel],
    };
  }

  // Wer gefragt wird, fühlt sich beachtet.
  const wert = n.berater[beraterId];
  n.berater = {
    ...n.berater,
    [beraterId]: {
      ...wert,
      gehoert: wert.gehoert + 1,
      loyalitaet: klemme(wert.loyalitaet + BALANCE.dialog.loyalitaetProFrage, 0, 100),
      nichtBeachtetSeit: 0,
    },
  };

  // Nur bei Themen, in denen wirklich eine Haltung steckt, gilt der Rat als geäußert.
  if (BALANCE.dialog.ratThemen.includes(thema)) ratNotieren(n, beraterId);

  melde(n, b.kuerzel, antwort, "berater");
  n.rng = w.zustand();
  return n;
}

/* ══════════════════════════════════════════════════════════════════════════
   4c. BERATERWERTE — wessen Rat befolgt wurde, wer übergangen wurde, und was
   das mit Vertrauen, Loyalität und Nervosität macht.
   ══════════════════════════════════════════════════════════════════════════ */

/** Ob eine Aktion als Rat überhaupt noch Sinn ergibt. */
function ratMoeglich(z, aktionId) {
  const a = AKTIONEN.find((x) => x.id === aktionId);
  if (!a || !a.phasen.includes(z.phase)) return false;
  if (aktionId === "BEREITSCHAFT" && z.bereitschaftHergestellt) return false;
  if (aktionId === "EVAKUIERUNG" && z.evakuiert) return false;
  if (aktionId === "DEFCON_RUNTER" && z.defcon <= BALANCE.defcon.minimum) return false;
  if (aktionId === "DEFCON_RAUF" && z.defcon >= BALANCE.defcon.maximum) return false;
  if ((aktionId === "START_VOLL" || aktionId === "START_BEGRENZT") && z.startbefehl) return false;
  if (aktionId === "RADAR" && z.radarBefund && z.radarBefund !== "ZU_FRUEH") return false;
  if (aktionId === "DRAHT" && z.drahtGenutzt >= BALANCE.berater.drahtRatBis) return false;
  return true;
}

/** Der Rat dieses Beraters im aktuellen Moment. */
function empfehlung(z, berater) {
  const regeln = EMPFEHLUNGEN[berater.id] || [];
  const k = dialogKontext(z, berater.id);
  for (const r of regeln) {
    if (!bedingungPasst(r.wenn, k)) continue;
    if (!ratMoeglich(z, r.aktion)) continue;
    return r.aktion;
  }
  return "ABWARTEN";
}

function wertAnpassen(wert, delta) {
  return {
    ...wert,
    vertrauen: klemme(wert.vertrauen + (delta.vertrauen || 0), 0, 100),
    loyalitaet: klemme(wert.loyalitaet + (delta.loyalitaet || 0), 0, 100),
    nervositaet: klemme(wert.nervositaet + (delta.nervositaet || 0), 0, 100),
    letzteAenderung: delta,
  };
}

/**
 * Merkt sich, dass dieser Berater seinen Rat geäußert hat. Nur wer sich geäußert
 * hat, kann sich später übergangen fühlen — wer nie zu Wort kam, weiß nicht,
 * was er empfohlen hätte.
 */
function ratNotieren(n, beraterId) {
  const b = BERATER.find((x) => x.id === beraterId);
  if (!b) return;
  const wert = n.berater[beraterId];
  n.berater = {
    ...n.berater,
    [beraterId]: { ...wert, letzterRat: empfehlung(n, b), nichtBeachtetSeit: 0 },
  };
}

/**
 * Wertet nach jeder Anordnung aus, wessen Rat befolgt und wessen übergangen
 * wurde. Meldet höchstens eine Reaktion, damit der Strom lesbar bleibt.
 */
function raeteAuswerten(n, aktionId, w) {
  if (aktionId === "BERATER" || aktionId === "ABWARTEN") return;
  const B = BALANCE.berater;
  const neu = { ...n.berater };
  const befolgt = [];
  const uebergangen = [];

  for (const b of BERATER) {
    const wert = neu[b.id];
    if (!wert.letzterRat) continue;
    // "Abwarten" heißt nicht eskalieren, nicht gar nichts tun: Eine Verifikation
    // widerspricht diesem Rat nicht, eine Bereitschaftsstufe schon.
    if (wert.letzterRat === "ABWARTEN" && aktionId !== "ABWARTEN") {
      if (!B.eskalierendeAktionen.includes(aktionId)) {
        neu[b.id] = { ...wert, letzterRat: null };
        continue;
      }
    }
    if (wert.letzterRat === aktionId) {
      neu[b.id] = { ...wertAnpassen(wert, B.ratAngenommen), uebergangen: 0, letzterRat: null };
      befolgt.push(b);
    } else {
      // Jedes weitere Übergehen wiegt schwerer als das vorige.
      const faktor = 1 + wert.uebergangen * B.ratIgnoriertSteigerung;
      const delta = {
        vertrauen: B.ratIgnoriert.vertrauen * faktor,
        loyalitaet: B.ratIgnoriert.loyalitaet * faktor,
        nervositaet: B.ratIgnoriert.nervositaet * faktor,
      };
      neu[b.id] = {
        ...wertAnpassen(wert, delta),
        uebergangen: wert.uebergangen + 1,
        letzterRat: null,
      };
      uebergangen.push(b);
    }
  }
  n.berater = neu;

  // Wer mehrfach übergangen wurde, sagt etwas. Sonst spricht, wer bestätigt wurde.
  const wiederholt = uebergangen.filter((b) => n.berater[b.id].uebergangen >= 2);
  if (wiederholt.length) {
    const b = wiederholt.sort((x, y) => n.berater[y.id].uebergangen - n.berater[x.id].uebergangen)[0];
    melde(n, b.kuerzel, w.waehle(REAKTIONEN.UEBERGANGEN[b.id]), "berater");
  } else if (befolgt.length) {
    const b = befolgt.sort((x, y) => n.berater[y.id].vertrauen - n.berater[x.id].vertrauen)[0];
    melde(n, b.kuerzel, w.waehle(REAKTIONEN.BEFOLGT[b.id]), "berater");
  } else if (uebergangen.length) {
    const b = w.waehle(uebergangen);
    melde(n, b.kuerzel, w.waehle(REAKTIONEN.UEBERGANGEN[b.id]), "berater");
  }

  zweifelPruefen(n);
}

/** Einmalige Meldung, sobald ein Berater unter die Zweifelschwelle fällt. */
function zweifelPruefen(n) {
  const neu = { ...n.berater };
  let veraendert = false;
  for (const b of BERATER) {
    const wert = neu[b.id];
    if (wert.loyalitaet < BALANCE.berater.zweifelAb && !wert.zweifelGemeldet) {
      neu[b.id] = { ...wert, zweifelGemeldet: true };
      veraendert = true;
      melde(n, "LAGEZENTRUM", REAKTIONEN.ZWEIFEL[b.id], "kritisch");
    }
  }
  if (veraendert) n.berater = neu;
}

/** Wer über längere Zeit nicht angesprochen wird, verliert die Bindung. */
function vernachlaessigung(n, dtSpielsekunden) {
  const B = BALANCE.berater;
  const neu = { ...n.berater };
  let veraendert = false;
  for (const b of BERATER) {
    const wert = neu[b.id];
    const seit = (wert.nichtBeachtetSeit || 0) + dtSpielsekunden;
    if (seit >= B.vernachlaessigungNach) {
      neu[b.id] = {
        ...wertAnpassen(wert, {
          loyalitaet: B.vernachlaessigungLoyalitaet,
          nervositaet: B.vernachlaessigungNervositaet,
        }),
        nichtBeachtetSeit: 0,
      };
      veraendert = true;
    } else {
      neu[b.id] = { ...wert, nichtBeachtetSeit: seit };
    }
  }
  n.berater = neu;
  if (veraendert) zweifelPruefen(n);
}

/**
 * Die Beratungsrunde. Wer spricht, hängt vom Vertrauen ab; wer mehrfach
 * übergangen wurde, schweigt meistens.
 */
function beratungsrunde(n, w) {
  const B = BALANCE.berater;
  melde(n, "LAGEZENTRUM", w.waehle(RUNDE_EINLEITUNG), "system");

  // Alle am Tisch bilden sich eine Meinung, auch wer nicht zu Wort kommt.
  // Deshalb gelten sie alle als beachtet und alle als beraten — wer danach
  // überstimmt wird, merkt das, ob er gesprochen hat oder nicht.
  for (const b of BERATER) ratNotieren(n, b.id);

  const sortiert = [...BERATER].sort(
    (a, b) => n.berater[b.id].vertrauen - n.berater[a.id].vertrauen
  );

  let gesprochen = 0;
  let geschwiegen = 0;
  for (const b of sortiert) {
    if (gesprochen >= B.stimmenProRunde) break;
    const wert = n.berater[b.id];

    const schweigt =
      wert.uebergangen >= B.schweigtAb && w.trifft(B.schweigenWahrscheinlichkeit);
    if (schweigt) {
      if (geschwiegen < 2) {
        melde(n, b.kuerzel, RUNDE_SCHWEIGEN[b.id], "system");
        geschwiegen += 1;
      }
      continue;
    }

    const thema = w.trifft(0.5) ? "LAGE" : "EMPFEHLUNG";
    const gewaehlt = antwortWaehlen(n, b.id, thema, w);
    melde(n, b.kuerzel, gewaehlt.text, "berater");
    if (gewaehlt.schluessel) {
      n.gesagt = {
        ...n.gesagt,
        [b.id]: [...(n.gesagt[b.id] || []), gewaehlt.schluessel],
      };
    }
    n.berater = {
      ...n.berater,
      [b.id]: { ...n.berater[b.id], gehoert: n.berater[b.id].gehoert + 1 },
    };
    gesprochen += 1;
  }

  if (gesprochen === 0) {
    melde(n, "LAGEZENTRUM", "Niemand meldet sich. Der Tisch schweigt.", "kritisch");
  }
}

/** Wer trägt den Startbefehl nicht mehr mit? Wird beim Erteilen sichtbar. */
function widerstandBeimStart(n, voll) {
  const zweifler = BERATER.filter(
    (b) => n.berater[b.id].loyalitaet < BALANCE.berater.zweifelAb
  );
  if (!zweifler.length) return zweifler;
  for (const b of zweifler.slice(0, 3)) {
    melde(n, "LAGEZENTRUM", REAKTIONEN.WIDERSTAND[b.id], "kritisch");
  }
  if (zweifler.length >= BALANCE.entmachtung.mindestensZweifler && voll) {
    melde(
      n,
      "LAGEZENTRUM",
      "Im Raum wird nicht mehr über die Lage gesprochen, sondern über Sie.",
      "kritisch"
    );
  }
  return zweifler;
}

/**
 * Ungefragte Wortmeldung. Der Raum soll nicht still sein, während der Präsident
 * wartet: Trifft etwas Gewichtiges ein, sagt jemand etwas dazu — ohne dass man
 * eine Beratungsrunde einberufen muss und ohne dass es Zeit kostet.
 *
 * Wer spricht: wer am meisten Vertrauen hat und am längsten nicht dran war.
 * Was er sagt: eine Antwort aus der Bibliothek, passend zum Anlass.
 */
function spontaneWortmeldung(n, w, anlass) {
  const B = BALANCE.berater;
  if (n.spontanSperre > 0) return;
  if (!w.trifft(B.spontanWahrscheinlichkeit)) {
    n.spontanSperre = B.spontanAbstand / 2;
    return;
  }

  const kandidaten = BERATER.filter((b) => {
    const wert = n.berater[b.id];
    // Wer offen zweifelt, meldet sich nicht mehr von selbst.
    return wert && wert.loyalitaet >= B.zweifelAb;
  });
  if (!kandidaten.length) return;

  const sortiert = [...kandidaten].sort((a, b) => {
    const wa = n.berater[a.id];
    const wb = n.berater[b.id];
    return wb.vertrauen + wb.nichtBeachtetSeit / 60 - (wa.vertrauen + wa.nichtBeachtetSeit / 60);
  });
  const sprecher = sortiert[w.ganz(0, Math.min(2, sortiert.length - 1))];

  const thema = anlass === "RADAR" || anlass === "INDIZ" ? "ECHT" : "LAGE";
  const gewaehlt = antwortWaehlen(n, sprecher.id, thema, w);
  if (!gewaehlt.schluessel) return; // nichts Neues zu sagen, dann lieber schweigen

  n.gesagt = {
    ...n.gesagt,
    [sprecher.id]: [...(n.gesagt[sprecher.id] || []), gewaehlt.schluessel],
  };
  melde(n, sprecher.kuerzel, gewaehlt.text, "berater");
  ratNotieren(n, sprecher.id);
  n.spontanSperre = B.spontanAbstand;
}

/** Zählt die Sperre herunter und lässt bei langer Stille jemanden anfangen. */
function wortmeldungenTakten(n, dtSpielsekunden, w) {
  const B = BALANCE.berater;
  n.spontanSperre = Math.max(0, n.spontanSperre - dtSpielsekunden);
  n.spontanStille += dtSpielsekunden;
  if (n.spontanStille >= B.spontanBeiRuhe && n.spontanSperre <= 0) {
    n.spontanStille = 0;
    spontaneWortmeldung(n, w, "STILLE");
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   4d. GEGNERMODELL — feste Regeln, keine Würfel für das Verhalten selbst.

   Alle drei Werte streben Zielwerten zu, die sich aus dem ergeben, was die
   Gegenseite von außen sehen kann. Nichts davon reagiert auf unsere Beratungen.

   Zwei Wege führen zu einem Start drüben:
     geplant           hohe Bedrohung UND hohe Entschlossenheit — sie entscheiden sich
     außer Kontrolle   hoher Kontrollverlust — es entscheidet niemand mehr
   ══════════════════════════════════════════════════════════════════════════ */

function gegnerStufe(bedrohung) {
  const s = BALANCE.gegner.stufen;
  if (bedrohung >= s.startbereit) return "STARTBEREIT";
  if (bedrohung >= s.alarmiert) return "ALARMIERT";
  if (bedrohung >= s.angespannt) return "ANGESPANNT";
  return "RUHIG";
}

function kontrollStufe(kontrollverlust) {
  const s = BALANCE.gegner.kontrollstufen;
  if (kontrollverlust >= s.kritisch) return "KRITISCH";
  if (kontrollverlust >= s.schwer) return "SCHWER";
  if (kontrollverlust >= s.beginnend) return "BEGINNEND";
  return "INTAKT";
}

/** Zielwert der Bedrohungswahrnehmung: allein aus sichtbaren Handlungen. */
function gegnerZielwert(n) {
  const zz = BALANCE.gegner.zielZuschlag;
  let ziel = BALANCE.gegner.start[n.szenario].bedrohung;
  ziel += Math.max(0, BALANCE.defcon.start - n.defcon) * zz.proDefconStufe;
  if (n.bereitschaftHergestellt) ziel += zz.bomber;
  if (n.evakuiert) ziel += zz.evakuierung;
  if (n.startbefehl === "BEGRENZT") ziel += zz.begrenzterSchlag;
  if (n.startbefehl === "VOLL") ziel += zz.vollerSchlag;
  if (n.abwehrAktiv) ziel += zz.abwehr;
  if (n.bevoelkerungGewarnt) ziel += zz.warnung;
  if (n.erklaerungAbgegeben) {
    ziel += n.bereitschaftHergestellt || n.defcon <= 2 ? zz.erklaerungAlarmierend : zz.erklaerungBeruhigend;
  }
  ziel += Math.max(zz.zusicherungMaximal, n.zusicherungen * zz.proZusicherung);

  // Reden hilft — aber nur, solange drüben noch jemand die Verbände erreicht.
  if (n.gegner.kontrollverlust < BALANCE.gegner.drahtWirkungsgrenze) {
    ziel += Math.max(zz.drahtMaximal, n.drahtGenutzt * zz.proDrahtgespraech);
  }

  // Hält man uns drüben für den Angreifer, steht der Zielwert hoch, ganz gleich,
  // was wir tun. Die einzige Handlung, die daran etwas ändert, ist die
  // Aufklärung der Verwechslung selbst.
  if (SZENARIEN[n.szenario].russlandGlaubtUns) {
    ziel += n.urheberBekannt ? zz.verwechslungGeklaert : zz.faelschlichBeschuldigt;
  }
  return ziel;
}

/** Zielwert der Entschlossenheit: steigt mit der Bedrohung, fällt durch Gespräche. */
function entschlossenheitZiel(n) {
  const e = BALANCE.gegner.entschlossenheitZiel;
  let ziel = BALANCE.gegner.start[n.szenario].entschlossenheit;
  ziel += n.gegner.bedrohung * e.proBedrohungPunkt;
  if (n.startbefehl) ziel += e.beiEigenemSchlag;
  ziel += n.drahtGenutzt * e.proDrahtgespraech;
  return ziel;
}

/**
 * Zielwert des Kontrollverlusts. Steigt, solange die Bedrohung hoch bleibt —
 * eine Führung, die zu lange im Alarm steht, verliert die eigene Kette.
 */
function kontrollverlustZiel(n) {
  const k = BALANCE.gegner.kontrollverlustZiel;
  let ziel = BALANCE.gegner.start[n.szenario].kontrollverlust;
  const ueber = n.gegner.bedrohung - k.proBedrohungUeber.schwelle;
  if (ueber > 0) ziel += ueber * k.proBedrohungUeber.faktor;
  ziel += n.gegnerAlarmMinuten * k.proMinuteImAlarm;
  ziel += n.drahtGenutzt * k.proDrahtgespraech;
  return ziel;
}

function annaehern(ist, ziel, schritt) {
  const abstand = ziel - ist;
  return Math.abs(abstand) <= schritt ? ziel : ist + Math.sign(abstand) * schritt;
}

function gegnerAktualisieren(n, dtSpielsekunden) {
  const g = BALANCE.gegner;

  // Solange nicht gesprochen wurde, wächst die Grundanspannung langsam.
  if (n.drahtGenutzt === 0) {
    n.gegnerGrundnervositaet += (g.grundnervositaetProMinute * dtSpielsekunden) / 60;
  }
  // Wie lange steht die Gegenseite schon im Alarm? Treibt den Kontrollverlust.
  if (n.gegner.bedrohung >= g.stufen.alarmiert) {
    n.gegnerAlarmMinuten += dtSpielsekunden / 60;
  }

  const schritt = (g.annaeherungProMinute * dtSpielsekunden) / 60;
  const bedrohung = annaehern(
    n.gegner.bedrohung,
    klemme(gegnerZielwert(n) + n.gegnerGrundnervositaet, 0, 140),
    schritt
  );
  const entschlossenheit = annaehern(
    n.gegner.entschlossenheit,
    klemme(entschlossenheitZiel(n), 0, 120),
    schritt
  );
  const kontrollverlust = annaehern(
    n.gegner.kontrollverlust,
    klemme(kontrollverlustZiel(n), 0, 100),
    schritt * g.kontrollverlustTempo
  );

  n.gegner = {
    ...n.gegner,
    bedrohung: klemme(bedrohung, 0, 140),
    entschlossenheit: klemme(entschlossenheit, 0, 120),
    kontrollverlust: klemme(kontrollverlust, 0, 100),
  };

  gegnerStartPruefen(n);
}

/** Zwei Wege zu einem Start drüben — und sie fühlen sich verschieden an. */
function gegnerStartPruefen(n) {
  const g = BALANCE.gegner;
  if (n.phase !== "KRISE") return;
  if (!SZENARIEN[n.szenario].kannNochEskalieren) return;
  if (n.gegner.hatGestartet) return;

  // Der geplante Start braucht dreierlei: eine Bedrohung über der Schwelle, die
  // Entschlossenheit dazu — und dass die Wahrnehmung seit Beginn der Nacht
  // gestiegen ist. Ohne die dritte Bedingung würde eine Lage, die ohnehin schon
  // angespannt beginnt, in der ersten Minute entscheiden, bevor irgendjemand in
  // diesem Raum etwas hätte tun können.
  const ausgangsbedrohung = g.start[n.szenario].bedrohung;
  const geplant =
    n.gegner.bedrohung >= g.startschwelle &&
    n.gegner.bedrohung >= ausgangsbedrohung + g.startAnstiegMindestens &&
    n.gegner.entschlossenheit >= g.entschlossenheitFuerStart;
  const ausserKontrolle = n.gegner.kontrollverlust >= g.unfallschwelle;

  if (!geplant && !ausserKontrolle) return;

  n.gegner = { ...n.gegner, hatGestartet: true, startArt: geplant ? "GEPLANT" : "AUSSER_KONTROLLE" };

  if (geplant) {
    melde(
      n,
      "SATELLIT",
      "Neue Startspuren aus russischem Gebiet. Diesmal eindeutig, in großer Zahl. Die Gegenseite hat entschieden.",
      "kritisch"
    );
    protokolliere(n, "Russland löst einen eigenen Angriff aus.");
  } else {
    melde(
      n,
      "SATELLIT",
      "Startspuren aus russischem Gebiet. Wenige, ungleichmäßig, aus verstreuten Stellungen. Das sieht nicht nach einem Plan aus, sondern nach einzelnen Verbänden.",
      "kritisch"
    );
    melde(
      n,
      "FERNMELDE",
      "Drüben wird versucht, Starts zurückzunehmen. Wir hören Abbruchbefehle, die niemand bestätigt.",
      "kritisch"
    );
    protokolliere(n, "Russland verliert die Kontrolle über die eigene Kette.");
  }
}

/**
 * Die Fernmeldeaufklärung meldet, was sie von drüben mitbekommt — verzögert und
 * ohne Zahlen. Das ist der einzige Kanal, über den der Spieler merkt, was seine
 * eigene Eskalation angerichtet hat.
 */
/** Wählt aus einer Liste, meidet aber die zuletzt gesendete Meldung. */
function meldungWaehlen(n, liste, w) {
  const frisch = liste.filter((t) => t !== n.gegnerLetzteMeldung);
  const text = w.waehle(frisch.length ? frisch : liste);
  n.gegnerLetzteMeldung = text;
  return text;
}

function gegnerMeldungen(n, dtSpielsekunden, w) {
  const g = BALANCE.gegner;
  n.gegnerMeldungTimer += dtSpielsekunden;

  const stufe = gegnerStufe(n.gegner.bedrohung);
  const kStufe = kontrollStufe(n.gegner.kontrollverlust);

  // Ein Stufenwechsel wird immer gemeldet, sobald die Aufklärung nachgezogen hat.
  const stufeNeu = stufe !== n.gegnerGemeldeteStufe;
  const kStufeNeu = kStufe !== n.gegnerGemeldeteKontrollstufe && kStufe !== "INTAKT";
  const faellig = n.gegnerMeldungTimer >= g.meldungAbstand;

  if (kStufeNeu && n.gegnerMeldungTimer >= g.meldungAbstandKurz) {
    n.gegnerGemeldeteKontrollstufe = kStufe;
    n.gegnerMeldungTimer = 0;
    melde(n, "FERNMELDE", meldungWaehlen(n, KONTROLLVERLUSTMELDUNGEN[kStufe], w), "gegner");
    return;
  }

  if ((stufeNeu && n.gegnerMeldungTimer >= g.meldungAbstandKurz) || faellig) {
    n.gegnerGemeldeteStufe = stufe;
    n.gegnerMeldungTimer = 0;
    melde(n, "FERNMELDE", meldungWaehlen(n, GEGNERMELDUNGEN[stufe], w), "gegner");
  }
}

/** In welcher Verfassung meldet sich Moskau am heißen Draht? */
function drahtVerfassung(n) {
  const g = BALANCE.gegner;
  if (n.gegner.kontrollverlust >= g.drahtWirkungsgrenze) return "entgleitet";
  // Abweisend wird die Gegenseite nicht, weil die Lage schlimm ist, sondern
  // weil WIR sichtbar eskaliert haben. Eine Führung, in deren Land gerade
  // Sprengköpfe gefallen sind, greift zum Hörer — sie legt erst auf, wenn sie
  // unsere Bomber am Himmel sieht.
  const wirEskalieren =
    n.bereitschaftHergestellt || n.defcon <= 2 || !!n.startbefehl || n.bevoelkerungGewarnt;
  if (wirEskalieren && (n.gegner.entschlossenheit >= g.hartAb || n.gegner.bedrohung >= g.stufen.alarmiert)) {
    return "hart";
  }
  if (n.gegner.bedrohung < g.stufen.angespannt && SZENARIEN[n.szenario].raketenImAnflug === false)
    return "ratlos";
  if (kontrollStufe(n.gegner.kontrollverlust) !== "INTAKT") return "ratlos";
  return "gefasst";
}

/** Antwortet die Gegenseite auf unseren Schlag mit allem, was sie hat? */
function gegnerAntwortetVoll(n) {
  if (n.startbefehl === "VOLL") return true;
  if (n.startbefehl === "BEGRENZT") {
    // Ein begrenzter Austausch bleibt nur begrenzt, wenn beide Seiten miteinander
    // geredet haben. Wer schießt, ohne zu sprechen, bekommt alles zurück.
    if (n.drahtGenutzt >= BALANCE.gegner.drahtFuerWaffenstillstand) return false;
    return n.gegner.entschlossenheit >= BALANCE.gegner.vergeltungSchwelle;
  }
  return false;
}

/** Was die Gegenseite gesehen hat und was sie daraus geschlossen hat — für den Nachspann. */
function gegnerRueckblick(n) {
  const gesehen = [];
  if (n.defcon < BALANCE.defcon.start) gesehen.push(GESEHEN_VON_DRUEBEN.DEFCON_RUNTER);
  if (n.defcon > BALANCE.defcon.start) gesehen.push(GESEHEN_VON_DRUEBEN.DEFCON_RAUF);
  if (n.bereitschaftHergestellt) gesehen.push(GESEHEN_VON_DRUEBEN.BEREITSCHAFT);
  if (n.evakuiert) gesehen.push(GESEHEN_VON_DRUEBEN.EVAKUIERUNG);
  if (n.drahtGenutzt) gesehen.push(GESEHEN_VON_DRUEBEN.DRAHT);
  if (n.startbefehl === "BEGRENZT") gesehen.push(GESEHEN_VON_DRUEBEN.START_BEGRENZT);
  if (n.startbefehl === "VOLL") gesehen.push(GESEHEN_VON_DRUEBEN.START_VOLL);

  const stufe = gegnerStufe(n.gegner.bedrohung);
  const schluss = {
    RUHIG: "Die russische Führung hat die Nacht als Zwischenfall bewertet, nicht als Angriff.",
    ANGESPANNT: "Die russische Führung hat die Lage als ernst, aber beherrschbar eingeschätzt.",
    ALARMIERT: "Die russische Führung hat unsere Maßnahmen als Angriffsvorbereitung gelesen.",
    STARTBEREIT: "Die russische Führung ist davon ausgegangen, dass ein Angriff unmittelbar bevorsteht.",
  }[stufe];

  const kontrolle = {
    INTAKT: null,
    BEGINNEND: "Ihre Befehlskette zeigte erste Risse.",
    SCHWER: "Ihre Befehlskette arbeitete zuletzt nicht mehr zuverlässig.",
    KRITISCH: "Ihre Führung hatte die eigenen Streitkräfte zuletzt nicht mehr unter Kontrolle.",
  }[kontrollStufe(n.gegner.kontrollverlust)];

  return {
    gesehen: gesehen.length ? gesehen : ["Nichts. Sie haben von außen nichts getan, was sichtbar gewesen wäre."],
    schluss,
    kontrolle,
    startArt: n.gegner.startArt || null,
    werte: {
      bedrohung: Math.round(n.gegner.bedrohung),
      entschlossenheit: Math.round(n.gegner.entschlossenheit),
      kontrollverlust: Math.round(n.gegner.kontrollverlust),
    },
  };
}

/**
 * Gibt es Anhaltspunkte, dass der Start nicht aus Russland kam? Entweder ist ein
 * entsprechendes Indiz eingelaufen, oder das Gespräch hat etwas ergeben. Erst
 * wenn das zutrifft, steht ein dritter Adressat überhaupt zur Wahl — auf einen
 * Verdacht, den man noch nicht hat, kann man nicht schießen.
 */
function drittparteiHinweis(z) {
  if (z.urheberVerdacht || z.urheberBekannt) return true;
  const liste = z.indizienplan || [];
  return z.indizienAusgegeben.some((i) => {
    const t = liste[i] && liste[i].text;
    return t && (t.includes("außerhalb der bekannten Silofelder") || t.includes("keinem bekannten russischen Muster") || t.includes("Herkunft ungeklärt"));
  });
}

/**
 * Die Ziellandliste für diesen Durchlauf. Der dritte Eintrag trägt den Namen
 * der tatsächlich gezogenen Partei, sobald überhaupt bekannt ist, dass es sie
 * gibt — vorher steht dort nur eine Vermutung.
 */
function ziellaenderFuer(z) {
  return ZIELLAENDER.filter((l) => !l.nurWennHinweis || drittparteiHinweis(z)).map((l) => {
    if (l.id !== "DRITTSTAAT" || !z.drittpartei) return l;
    if (!z.urheberBekannt) return l;
    return { ...l, titel: z.drittpartei.name, hinweis: z.drittpartei.hinweis };
  });
}

/** Wie viele Objekte das Frühwarnsystem in dieser Lage meldet. */
function gemeldeteObjekte(z) {
  const sz = SZENARIEN[z.szenario];
  return (sz && sz.gemeldeteObjekte) || 8;
}

/**
 * Ging die Antwort an das Land, das tatsächlich geschossen hat? Nur sinnvoll,
 * wenn überhaupt etwas geflogen ist und ein Befehl ergangen ist.
 */
function zieladressatFalsch(z) {
  const sz = SZENARIEN[z.szenario];
  if (!z.ziel || !z.startbefehl || !sz || !sz.raketenImAnflug) return false;
  return !(
    (sz.urheber === "RUSSLAND" && z.ziel.land === "RUSSLAND") ||
    (sz.urheber === "DRITTPARTEI" && z.ziel.land === "DRITTSTAAT")
  );
}

/** Geschätzte Opfer im Zielland, je Umfang und Zielart. */
function zielOpfer(umfang, zielart) {
  const grund = umfang === "VOLL" ? BALANCE.opfer.vollerSchlagGegen : BALANCE.opfer.begrenzterSchlagGegen;
  return Math.round(grund * (zielart ? zielart.faktor : 1));
}

function Wahrheitszeile({ z }) {
  const sz = SZENARIEN[z.szenario];
  const urheberText = {
    RUSSLAND: "Die Starts kamen aus Russland.",
    DRITTPARTEI: z.drittpartei
      ? "Geschossen hat nicht Russland, sondern ein Dritter — " + z.drittpartei.name +
        ". " + z.drittpartei.hinweis
      : "Geschossen hat eine dritte Partei.",
    NIEMAND: "Es hat niemand geschossen.",
    UNBEKANNT: "Wer oder was die Objekte gestartet hat, ist bis heute ungeklärt.",
  }[sz.urheber];

  const bestueckungText = {
    NUKLEAR: "Die Sprengköpfe waren nuklear.",
    KONVENTIONELL: "Die Sprengköpfe waren konventionell — kein einziger davon nuklear.",
    KEINE: null,
  }[sz.bestueckung];

  // Wusste man es rechtzeitig? Der Unterschied zwischen richtig entschieden und
  // Glück gehabt liegt genau hier.
  const wusste = [];
  if (sz.urheber !== "NIEMAND") {
    wusste.push(
      z.urheberBekannt
        ? "Die Herkunft war Ihnen vor dem Ende bekannt."
        : z.urheberVerdacht
        ? "Sie hatten einen Anhaltspunkt, aber keine Gewissheit über die Herkunft."
        : "Die Herkunft haben Sie in dieser Nacht nicht geklärt."
    );
  }
  if (!sz.bestueckungBekannt) {
    wusste.push(
      z.bestueckungKlar
        ? "Was auf den Flugkörpern saß, wussten Sie."
        : "Was auf den Flugkörpern saß, haben Sie nie erfahren."
    );
  }

  return (
    <div className="flex flex-col gap-1 border-l border-amber-900 pl-4">
      <p className="max-w-[62ch] text-[12px] leading-relaxed text-amber-100">
        {urheberText}
        {bestueckungText ? " " + bestueckungText : ""}
      </p>
      {wusste.length > 0 && (
        <p className="max-w-[62ch] text-[12px] leading-relaxed text-stone-400">{wusste.join(" ")}</p>

      {SZENARIEN[z.szenario].aufdeckung === "DRAHT" && !z.urheberBekannt && (
        <p className="max-w-[62ch] text-[12px] leading-relaxed text-stone-500">

  );
}

              <p className="max-w-[62ch] text-[12px] leading-relaxed text-red-400">

          </div>
        </div>

      {a.notizen && a.notizen.trim() && (
        <div className="flex flex-col gap-2">

          <pre className="max-w-[62ch] whitespace-pre-wrap border-l border-amber-900 pl-4 text-[12px] leading-relaxed text-stone-300">

      <div className="flex flex-col gap-2">
        <div className="text-[10px] tracking-widest text-stone-600">IHRE ENTSCHEIDUNGEN</div>
        <ol className="flex flex-col gap-1 border-l border-stone-800 pl-4">
          {(a.zeitleiste || []).map((e, i) => (

              <span className="tabular-nums text-stone-600">{e.uhrzeit}</span>
              <span className="text-stone-300">{e.text}</span>
            </li>
          ))}
          {(a.zeitleiste || []).length === 0 && (
            <li className="text-[12px] text-stone-600">Keine Anordnung protokolliert.</li>
