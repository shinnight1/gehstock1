      <div className="flex flex-col gap-3 border-t border-stone-800 pt-6">
        <div className="text-[10px] tracking-widest text-stone-600">ZUM VERGLEICH: REALE FEHLALARME</div>
        <div className="flex flex-col gap-4">
          {HISTORISCHE_HINWEISE.map((h) => (
            <div key={h.titel} className="grid grid-cols-[4rem_1fr] gap-3">
              <span className="text-[12px] tabular-nums text-amber-700">{h.jahr}</span>
              <div className="flex flex-col gap-1">

      </div>

      <button
        onClick={onNeustart}
        className="self-start border border-stone-700 px-4 py-2 text-[12px] tracking-[0.2em] text-stone-300 hover:border-amber-700 hover:text-amber-300 focus:outline-none focus:ring-1 focus:ring-amber-600"
      >
        NEUER DURCHLAUF
      </button>
    </div>
  );
}


/* ══════════════════════════════════════════════════════════════════════════
   5b. RAUM — das Raumbild ist die Bühne. Darüber liegen nur:
   Klickflächen in der Form der Sache, ein weicher Schein als Markierung,
   die Spuren auf der Lagekarte, Countdown und Bereitschaft.

   Die Beschriftungen des Tischterminals stehen im Bild und bleiben dort.
   ══════════════════════════════════════════════════════════════════════════ */

const STIMMUNGSPUNKT = {
  RUHIG: null,
  ANGESPANNT: "#8a7648",
  SCHROFF: "#c98f2c",
  ZWEIFELND: "#c1392b",
};

function alsFlaeche(b) {
  return { left: b.x + "%", top: b.y + "%", width: b.breite + "%", height: b.hoehe + "%" };
}

/**
 * Anklickbares Feld in der Form der Sache. Der Schein liegt unter dem Zeiger,
 * nicht als Kasten darum — ein Rechteck um einen Menschen sieht aus wie ein Fehler.
 */
function Klickflaeche({ bereich, form, markiert, beruehrt, beschriftung, onKlick, onZeiger, kinder }) {
  const clip = form ? HITBOX[form] : HITBOX.personEllipse;
  // Sichtbarkeit über React, nicht über eine Hover-Klasse: eine Inline-Opazität
  // würde group-hover immer schlagen, und dann leuchtet nie etwas auf.
  const sichtbar = markiert || beruehrt;
  return (
    <button
      onClick={onKlick}
      onMouseEnter={onZeiger}
      onMouseLeave={() => onZeiger(null)}
      onFocus={onZeiger}
      onBlur={() => onZeiger(null)}
      className="absolute focus:outline-none"
      style={{ ...alsFlaeche(bereich), clipPath: clip, WebkitClipPath: clip }}
      aria-label={beschriftung}
    >
      <span
        className="absolute inset-0 transition-opacity duration-150"
        style={{
          opacity: sichtbar ? 1 : 0,
          background:
            "radial-gradient(ellipse at 50% 58%, " +
            BILDFARBEN.scheinInnen +
            " 0%, rgba(224,164,55,0.20) 44%, " +
            BILDFARBEN.scheinAussen +
            " 74%)",
          boxShadow: markiert
            ? "inset 0 0 18px " + BILDFARBEN.scheinRand
            : "inset 0 0 14px " + BILDFARBEN.scheinRand,
        }}
      />
      {kinder}
    </button>
  );
}

/* ── Spuren auf der Lagekarte ──────────────────────────────────────────── */

/**
 * Solange nur die Satelliten melden, bleibt die Karte leer — die Meldung ist ja
 * genau das, was in Frage steht. Erst eine unabhängige Bestätigung setzt die
 * Objekte auf den Schirm.
 */
function spurenLage(z) {
  const bestaetigt =
    z.radarBefund === "BESTAETIGT" || z.flugBefund === "BESTAETIGT" || z.gegner.hatGestartet;
  if (!bestaetigt) return null;
  const anzahl = z.gegner.hatGestartet
    ? Math.min(18, gemeldeteObjekte(z) + 6)
    : gemeldeteObjekte(z);
  return { anzahl, quelle: z.gegner.hatGestartet ? "ZWEITE_WELLE" : "BESTAETIGT" };
}

/**
 * Bahn einer Spur als kubische Bézier. Beide Kontrollpunkte liegen oben auf
 * Polhöhe: die Kurve steigt schnell, läuft lange flach und fällt dann steil —
 * das ist die Form, die eine Polroute auf einer Mercator-Karte annimmt.
 */
function bahnPunkt(start, ziel, polhoehe, t) {
  const p1 = { x: start.x - KARTE.ausholen, y: polhoehe };
  const p2 = { x: ziel.x + KARTE.ausholen, y: polhoehe };
  const s = 1 - t;
  const a = s * s * s;
  const b = 3 * s * s * t;
  const c = 3 * s * t * t;
  const d = t * t * t;
  return {
    x: a * start.x + b * p1.x + c * p2.x + d * ziel.x,
    y: Math.max(KARTE.obergrenze, a * start.y + b * p1.y + c * p2.y + d * ziel.y),
  };
}

function Spuren({ z }) {
  const lage = spurenLage(z);
  if (!lage) return null;

  const fortschritt =
    z.phase === "KRISE" ? klemme(1 - z.rest / (z.flugzeit || BALANCE.zeit.flugzeitSekunden), 0, 1) : 1;

  const bahnen = [];
  for (let i = 0; i < lage.anzahl; i++) {
    // Feste Streuung je Index: die Spuren liegen bei jedem Bild gleich.
    const a = ((i * 2654435761) % 1000) / 1000;
    const b = ((i * 40503) % 997) / 997;
    const start = {
      x: KARTE.startgebiet.x + a * KARTE.startgebiet.breite,
      y: KARTE.startgebiet.y + b * KARTE.startgebiet.hoehe,
    };
    const ziel = {
      x: KARTE.zielgebiet.x + b * KARTE.zielgebiet.breite,
      y: KARTE.zielgebiet.y + a * KARTE.zielgebiet.hoehe,
    };
    const polhoehe = KARTE.polhoehe + (a - 0.5) * 10;
    const t = klemme(fortschritt + (a - 0.5) * 0.06, 0, 1);
    const jetzt = bahnPunkt(start, ziel, polhoehe, t);

    // Der Schweif zeigt die gesamte bisher zurückgelegte Bahn, wie auf einer
    // echten Verfolgungsanzeige — nicht nur ein kurzes Stück dahinter.
    const schweif = [];
    const schritte = 24;
    for (let k = 0; k <= schritte; k++) {
      const tk = (t * k) / schritte;
      const punkt = bahnPunkt(start, ziel, polhoehe, tk);
      schweif.push(punkt.x.toFixed(1) + "," + punkt.y.toFixed(1));
    }
    bahnen.push({ i, start, ziel, jetzt, schweif: schweif.join(" "), gross: i % 3 === 0 });
  }

  return (
    <svg
      className="pointer-events-none absolute inset-0 h-full w-full"
      viewBox={"0 0 " + BILD.breite + " " + BILD.hoehe}
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      {/* Startpunkte: kleine Kreuze über den Startgebieten */}
      {bahnen.map((s) => (
        <g key={"a" + s.i} stroke={BILDFARBEN.spurMarke} strokeWidth="1.6">
          <line x1={s.start.x - 3.5} y1={s.start.y} x2={s.start.x + 3.5} y2={s.start.y} />
          <line x1={s.start.x} y1={s.start.y - 3.5} x2={s.start.x} y2={s.start.y + 3.5} />
        </g>
      ))}
      {/* Zurückgelegte Bahn */}
      {bahnen.map((s) => (
        <polyline
          key={"s" + s.i}
          points={s.schweif}
          fill="none"
          stroke={BILDFARBEN.spurSchweif}
          strokeWidth={KARTE.spurBreite}
          strokeLinecap="round"
          strokeDasharray="3 3"
        />
      ))}
      {/* Zielräume */}
      {bahnen.map((s) => (
        <circle
          key={"z" + s.i}
          cx={s.ziel.x}
          cy={s.ziel.y}
          r="5"
          fill="none"
          stroke={BILDFARBEN.spurMarke}
          strokeWidth="1.5"
          strokeDasharray="3 2.5"
        />
      ))}
      {/* Der Gefechtskopf selbst */}
      {bahnen.map((s) => (
        <circle
          key={"p" + s.i}
          cx={s.jetzt.x}
          cy={s.jetzt.y}
          r={s.gross ? KARTE.punktGross : KARTE.punktKlein}
          fill={s.gross ? BILDFARBEN.spurKopf : BILDFARBEN.spurEcht}
        />
      ))}
    </svg>
  );
}

/* ── Der Raum ──────────────────────────────────────────────────────────── */

function RaumSzene({ z, onFigur, onGegenstand, onFeld, aktivesFeld }) {
  const [hover, setHover] = useState(null);
  const alarm = z.defcon <= 2 || z.rest < BALANCE.anzeige.engAb;

  const personen = BERATER.map((b) => ({
    b,
    bereich: SITZORDNUNG[b.id] || ZUGESCHALTET[b.id],
    zugeschaltet: !SITZORDNUNG[b.id],
  })).filter((p) => p.bereich);

  return (
    <div className="relative flex min-h-0 w-full flex-1 items-center justify-center overflow-hidden">
      <div
        className="relative"
        style={{
          aspectRatio: BILD.breite + " / " + BILD.hoehe,
          maxHeight: "100%",
          maxWidth: "100%",
          height: "100%",
        }}
      >
        <img
          src={RAUMBILD}
          alt="Lagezentrum bei Nacht: sieben Regierungsmitglieder an einem Konferenztisch, dahinter eine Weltkarte"
          className="absolute inset-0 h-full w-full select-none"
          draggable={false}
        />

        <Spuren z={z} />

        {/* Personen: elliptische Fläche, Schein von unten */}
        {personen.map(({ b, bereich, zugeschaltet }) => {
          const punkt = STIMMUNGSPUNKT[beraterStimmung(z, b.id)];
          return (
            <Klickflaeche
              key={b.id}
              bereich={bereich}
              form="personEllipse"
              markiert={z.gespraechMit === b.id}
              beschriftung={b.name + ", " + b.rolle}
              onKlick={() => onFigur(b.id)}
              beruehrt={hover && hover.id === b.id}
              onZeiger={(e) =>
                setHover(
                  e === null
                    ? null
                    : {
                        id: b.id,
                        name: b.name,
                        hinweis: zugeschaltet ? b.rolle + " · zugeschaltet" : b.rolle,
                      }
                )
              }
              kinder={
                punkt ? (
                  <span
                    className="absolute left-1/2 top-[6%] -translate-x-1/2 rounded-full"
                    style={{ width: "7px", height: "7px", background: punkt }}
                  />
                ) : null
              }
            />
          );
        })}

        {/* Gegenstände in ihrer eigenen Form */}
        {Object.entries(GEGENSTAENDE).map(([id, g]) => (
          <Klickflaeche
            key={id}
            bereich={g}
            form={g.form}
            markiert={false}
            beruehrt={hover && hover.id === id}
            beschriftung={g.name}
            onKlick={() => onGegenstand(id)}
            onZeiger={(e) =>
              setHover(e === null ? null : { id, name: g.name, hinweis: g.hinweis })
            }
          />
        ))}

        {/* Terminalfelder: die Aufschrift steht im Bild, hier liegt nur die Fläche */}
        {TERMINALFELDER.map((f) => {
          const aktiv = f.id === aktivesFeld;
          const offen =
            f.art === "AKTIONEN"
              ? AKTIONEN.filter(
                  (a) => a.kategorie === f.id && a.phasen.includes(z.phase) && aktionVerfuegbar(z, a)
                ).length
              : 0;
          return (
            <button
              key={f.id}
              onClick={() => onFeld(f)}
              onMouseEnter={() => setHover({ id: f.id, name: f.aufschrift, hinweis: f.inhalt })}
              onMouseLeave={() => setHover(null)}
              onFocus={() => setHover({ id: f.id, name: f.aufschrift, hinweis: f.inhalt })}
              onBlur={() => setHover(null)}
              className="absolute focus:outline-none"
              style={alsFlaeche(f)}
              aria-label={f.aufschrift + ": " + f.inhalt}
            >
              <span
                className="absolute inset-0 transition-opacity duration-150"
                style={{
                  opacity: aktiv || (hover && hover.id === f.id) ? 1 : 0,
                  background: aktiv ? "rgba(224,164,55,0.22)" : "rgba(224,164,55,0.15)",
                  boxShadow: "inset 0 0 8px rgba(240,190,110,0.65)",
                }}
              />
              {offen > 0 && (
                <span
                  className="absolute -right-1 -top-1 tabular-nums"
                  style={{
                    color: alarm ? BILDFARBEN.feldSchriftAlarm : BILDFARBEN.feldSchrift,
                    fontSize: "clamp(6px, 0.95vh, 11px)",
                  }}
                >
                  {offen}
                </span>
              )}
            </button>
          );
        })}

        {/* Countdown */}
        <div className="pointer-events-none absolute right-[2%] top-[2%] text-right">
          <div className="text-[9px] tracking-widest text-stone-400/70">
            {z.phase === "VERGELTUNG" ? "ENTSCHEIDUNG" : "BIS ZUM EINSCHLAG"}
          </div>
          <div
            className={
              "tabular-nums leading-none drop-shadow-[0_1px_4px_rgba(0,0,0,0.95)] " +
              (alarm
                ? "font-semibold tracking-tighter text-red-500"
                : "font-light tracking-tight text-amber-400")
            }
            style={{ fontSize: "clamp(20px, 4.4vh, 46px)" }}
          >
            {zeitText(z.rest)}
          </div>
        </div>

        {/* Bereitschaft und laufende Anordnung */}
        <div className="pointer-events-none absolute left-[2%] top-[2%] flex flex-col gap-1">
          <div
            className={
              "tracking-widest drop-shadow-[0_1px_4px_rgba(0,0,0,0.95)] " +
              (z.defcon <= 2 ? "text-red-500" : "text-amber-400/85")
            }
            style={{ fontSize: "clamp(8px, 1.3vh, 14px)" }}
          >
            DEFCON {z.defcon}
          </div>
          {z.laufend && (
            <div className="border border-amber-900/80 bg-stone-950/85 px-2 py-1">
              <div className="text-[10px] tracking-widest text-amber-500">
                {(AKTIONEN.find((a) => a.id === z.laufend.id) || {}).titel}
              </div>
              <div className="text-[10px] tabular-nums text-stone-400">
                NOCH {zeitText(z.laufend.rest)}
              </div>
            </div>
          )}
        </div>

        {hover && (
          <div className="pointer-events-none absolute bottom-[1.5%] left-1/2 -translate-x-1/2 border border-stone-700 bg-stone-950/95 px-3 py-1">
            <div className="text-center text-[12px] tracking-wide text-amber-300">{hover.name}</div>
            <div className="text-center text-[10px] tracking-wider text-stone-500">{hover.hinweis}</div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
   5d. NOTIZBUCH — die einzige Stelle, an der man nachliest, was gesagt wurde.

   Kein Nachrichtenstrom mit Sprecherspalten, sondern eine Mitschrift, wie sie
   ein Protokollant führt: Uhrzeit, Kürzel, ein Satz. Wird eine Seite voll,
   blättert man um. Die letzte Seite ist leer und gehört dem Präsidenten.
   ══════════════════════════════════════════════════════════════════════════ */

/** Nachname einer Figur, für die knappe Form in der Mitschrift. */
function kurzname(quelle) {
  const b = BERATER.find((x) => x.kuerzel === quelle);
  if (!b) return null;
  const teile = b.name.split(" ");
  return teile[teile.length - 1];
}

/*
 * Formt einen Logeintrag in eine Mitschriftzeile um. Der Protokollant schreibt
 * Personen mit Namen, Meldungen mit ihrer Quelle und eigene Anordnungen mit
 * einem Pfeil — so, wie man es in einem Block sortiert.
 */
function mitschriftZeile(e) {
  const name = kurzname(e.quelle);
  // Manche Meldungen beginnen selbst mit "03:12 Uhr." — das stünde sonst doppelt.
  e = { ...e, text: e.text.replace(/^\d{2}:\d{2} Uhr\.\s*/, "") };
  if (e.ton === "befehl" && e.quelle === "PRÄSIDENT") {
    return { zeit: e.uhrzeit, kopf: null, text: e.text, art: "anordnung" };
  }
  if (name) return { zeit: e.uhrzeit, kopf: name, text: e.text, art: "person" };
  if (e.quelle === "LAGEZENTRUM") return { zeit: e.uhrzeit, kopf: null, text: e.text, art: "lage" };
  if (e.quelle === "MOSKAU") return { zeit: e.uhrzeit, kopf: "Moskau", text: e.text, art: "gegner" };
  const quellen = {
    SATELLIT: "Satellit",
    RADAR: "Radar",
    FERNMELDE: "Fernmelde",
    MARINE: "Marine",
    AUSWERTUNG: "Auswertung",
    "PRÜFDIENST": "Prüfdienst",
    WETTER: "Wetter",
    LUFTWAFFE: "Luftwaffe",
    STRATKOM: "Strat. Kdo.",
  };
  return {
    zeit: e.uhrzeit,
    kopf: quellen[e.quelle] || e.quelle,
    text: e.text,
    art: e.ton === "kritisch" ? "kritisch" : "meldung",
  };
}

/** Schätzt, wie viele Zeilen ein Eintrag auf dem Papier braucht. */
function zeilenbedarf(eintrag) {
  const laenge = (eintrag.kopf ? eintrag.kopf.length + 2 : 0) + eintrag.text.length;
  return Math.max(1, Math.ceil(laenge / BALANCE.notizbuch.zeichenProZeile));
}

/** Verteilt die Mitschrift auf Seiten, ohne Einträge zu zerreißen. */
function seitenAufteilen(eintraege) {
  const seiten = [];
  let seite = [];
  let zeilen = 0;
  for (const e of eintraege) {
    const bedarf = zeilenbedarf(e);
    if (zeilen + bedarf > BALANCE.notizbuch.zeilenProSeite && seite.length) {
      seiten.push(seite);
      seite = [];
      zeilen = 0;
    }
    seite.push(e);
    zeilen += bedarf;
  }
  if (seite.length) seiten.push(seite);
  return seiten.length ? seiten : [[]];
}

const TINTE = {
  lage: "#2f3540",
  person: "#1f2a3a",
  meldung: "#33302a",
  kritisch: "#6b2018",
  gegner: "#243c50",
  anordnung: "#4a3410",
};

function Notizbuch({ z, onNotiz }) {
  const eintraege = z.log.map(mitschriftZeile);
  const seiten = seitenAufteilen(eintraege);
  const eigeneSeite = seiten.length; // Index der beschreibbaren Seite
  const [seite, setSeite] = useState(Math.max(0, seiten.length - 1));

  // Beim Öffnen und bei neuen Einträgen auf der letzten Mitschriftseite bleiben,
  // solange nicht selbst zurückgeblättert wurde.
  const letzteRef = useRef(seiten.length);
  useEffect(() => {
    if (seiten.length !== letzteRef.current) {
      if (seite >= letzteRef.current - 1 && seite !== eigeneSeite) setSeite(seiten.length - 1);
      letzteRef.current = seiten.length;
    }
  }, [seiten.length, seite, eigeneSeite]);

  const aufEigener = seite === eigeneSeite;
  const gesamt = seiten.length + 1;

  return (
    <div className="flex h-full flex-col">
      <div className="flex shrink-0 items-baseline justify-between gap-4 border-b border-stone-800 px-4 py-1.5">
        <div className="flex items-baseline gap-3">
          <span className="text-[12px] text-amber-300">
            {aufEigener ? "Eigene Notizen" : "Mitschrift"}
          </span>
          <span className="text-[10px] tracking-wider text-stone-600">
            SEITE {seite + 1} VON {gesamt}
          </span>
        </div>
        <div className="flex items-baseline gap-2">
          <button
            onClick={() => setSeite((s) => Math.max(0, s - 1))}
            disabled={seite === 0}
            className="border border-stone-800 px-2 py-0.5 text-[11px] text-stone-400 hover:border-stone-600 hover:text-stone-200 disabled:opacity-25 focus:outline-none focus:ring-1 focus:ring-amber-600"
          >
            ‹ ZURÜCK
          </button>
          <button
            onClick={() => setSeite((s) => Math.min(eigeneSeite, s + 1))}
            disabled={seite === eigeneSeite}
            className="border border-stone-800 px-2 py-0.5 text-[11px] text-stone-400 hover:border-stone-600 hover:text-stone-200 disabled:opacity-25 focus:outline-none focus:ring-1 focus:ring-amber-600"
          >
            WEITER ›
          </button>
          <button
            onClick={() => setSeite(eigeneSeite)}
            className={
              "border px-2 py-0.5 text-[10px] tracking-widest focus:outline-none focus:ring-1 focus:ring-amber-600 " +
              (aufEigener
                ? "border-amber-700 text-amber-300"
                : "border-stone-800 text-stone-500 hover:border-stone-600 hover:text-stone-300")
            }
          >
            EIGENE SEITE
          </button>
        </div>
      </div>

      {/* Das Papier */}
      <div className="min-h-0 flex-1 overflow-y-auto p-3">
        <div
          className="mx-auto min-h-full w-full max-w-4xl px-8 py-5"
          style={{
            background: "#cdc6b2",
            backgroundImage:
              "repeating-linear-gradient(to bottom, transparent, transparent " +
              (BALANCE.notizbuch.zeilenhoehe - 1) +
              "px, #b3ab97 " +
              (BALANCE.notizbuch.zeilenhoehe - 1) +
              "px, #b3ab97 " +
              BALANCE.notizbuch.zeilenhoehe +
              "px)",
            boxShadow: "inset 0 0 44px rgba(90,80,60,0.35)",
            fontFamily: "ui-serif, Georgia, 'Times New Roman', serif",
          }}
        >
          {aufEigener ? (
            <textarea
              value={z.notizen}
              onChange={(e) => onNotiz(e.target.value)}
              spellCheck={false}
              placeholder="Was widerspricht sich. Wem Sie glauben. Was Sie entschieden haben und warum."
              className="w-full resize-none border-0 bg-transparent p-0 text-[15px] text-stone-800 placeholder:text-stone-500/70 focus:outline-none"
              style={{
                lineHeight: BALANCE.notizbuch.zeilenhoehe + "px",
                minHeight: BALANCE.notizbuch.zeilenhoehe * BALANCE.notizbuch.zeilenProSeite + "px",
                fontFamily: "inherit",
              }}
            />
          ) : (
            <div
              style={{
                lineHeight: BALANCE.notizbuch.zeilenhoehe + "px",
                minHeight: BALANCE.notizbuch.zeilenhoehe * BALANCE.notizbuch.zeilenProSeite + "px",
              }}
            >
              {seiten[seite].length === 0 && (
                <p className="text-[15px] text-stone-500/80">Noch nichts mitgeschrieben.</p>
              )}
              {seiten[seite].map((e, i) => (
                <p
                  key={i}
                  className="text-[15px]"
                  style={{
                    color: TINTE[e.art] || TINTE.meldung,
                    textIndent: "-2.6rem",
                    paddingLeft: "2.6rem",
                    fontWeight: e.art === "kritisch" ? 600 : 400,
                  }}
                >
                  <span className="tabular-nums text-stone-600/80">{e.zeit.slice(0, 5)}</span>{" "}
                  {e.art === "anordnung" && <span className="text-stone-700">— </span>}
                  {e.kopf && <span style={{ fontWeight: 600 }}>{e.kopf}: </span>}
                  {e.text}
                </p>
              ))}
            </div>
          )}
        </div>
      </div>

      <div className="shrink-0 border-t border-stone-800 px-4 py-1 text-[10px] tracking-wider text-stone-600">
        {aufEigener
          ? "EIGENE NOTIZEN KOSTEN KEINE LAGEZEIT UND ERSCHEINEN IM NACHSPANN"
          : "DER PROTOKOLLANT SCHREIBT MIT. BLÄTTERN KOSTET KEINE ZEIT."}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
   5e. FENSTER — jeder Klick im Raum öffnet ein eigenes Fenster, das man
   verschieben und schließen kann. Mehrere dürfen gleichzeitig offen sein;
   das zuletzt angefasste liegt oben.

   Jede Sache im Raum hat genau einen Punkt, an dem sie sich öffnet:
     Person        → Gespräch
     Notizblock    → Notizbuch
     Terminalfeld  → Anordnungen oder Anzeige dieses Ressorts
     Roter Hörer   → keine Anzeige, sondern die Anordnung selbst
   ══════════════════════════════════════════════════════════════════════════ */

const FENSTERGROESSE = {
  GESPRAECH: { breite: 480, hoehe: 380 },
  NOTIZBUCH: { breite: 640, hoehe: 440 },
  ANORDNUNGEN: { breite: 420, hoehe: 340 },
  ANZEIGE: { breite: 440, hoehe: 300 },
  ZIELAUSWAHL: { breite: 520, hoehe: 400 },
};

/** Staffelt neue Fenster, damit sie sich nicht exakt überdecken. */
function startPosition(anzahl, groesse, buehne) {
  const versatz = (anzahl % 6) * 28;
  return {
    x: klemme(60 + versatz, 8, Math.max(8, buehne.breite - groesse.breite - 8)),
    y: klemme(56 + versatz, 8, Math.max(8, buehne.hoehe - groesse.hoehe - 8)),
  };
}

function Fenster({ f, obenauf, onSchliessen, onFokus, onBewegen, kinder }) {
  const zieht = useRef(null);

  function beiGriff(ev) {
    onFokus(f.id);
    const start = { maus: { x: ev.clientX, y: ev.clientY }, pos: { x: f.x, y: f.y } };
    zieht.current = start;

    function bewegen(e) {
      if (!zieht.current) return;
      onBewegen(f.id, {
        x: zieht.current.pos.x + (e.clientX - zieht.current.maus.x),
        y: zieht.current.pos.y + (e.clientY - zieht.current.maus.y),
      });
    }
    function loslassen() {
      zieht.current = null;
      window.removeEventListener("mousemove", bewegen);
      window.removeEventListener("mouseup", loslassen);
    }
    window.addEventListener("mousemove", bewegen);
    window.addEventListener("mouseup", loslassen);
    ev.preventDefault();
  }

  return (
    <div
      className="absolute flex flex-col border bg-stone-950/97 shadow-[0_8px_30px_rgba(0,0,0,0.7)]"
      style={{
        left: f.x,
        top: f.y,
        width: f.breite,
        maxHeight: f.hoehe,
        zIndex: f.z,
        borderColor: obenauf ? "#6b5326" : "#292524",
      }}
      onMouseDown={() => onFokus(f.id)}
    >
      <div
        onMouseDown={beiGriff}
        className="flex shrink-0 cursor-move items-baseline justify-between gap-4 border-b px-3 py-1.5 select-none"
        style={{ borderColor: obenauf ? "#3d2f16" : "#231f1c", background: obenauf ? "#171310" : "#121010" }}
      >
        <span className="flex items-baseline gap-2 truncate">
          <span className={"text-[11px] tracking-widest " + (obenauf ? "text-amber-400" : "text-stone-500")}>
            {f.titel}
          </span>
          {f.untertitel && (
            <span className="truncate text-[10px] tracking-wider text-stone-600">{f.untertitel}</span>
          )}
        </span>
        <button
          onClick={(e) => {
            e.stopPropagation();
            onSchliessen(f.id);
          }}
          onMouseDown={(e) => e.stopPropagation()}
          className="shrink-0 border border-stone-800 px-1.5 text-[11px] leading-4 text-stone-500 hover:border-red-800 hover:text-red-400 focus:outline-none focus:ring-1 focus:ring-amber-600"
          aria-label={"Fenster " + f.titel + " schließen"}
        >
          ×
        </button>
      </div>
      <div className="min-h-0 flex-1 overflow-y-auto">{kinder}</div>
    </div>
  );
}

        >
          ZURÜCKTRETEN
        </button>
        <span className="text-[10px] tracking-wider text-stone-700">

        </span>
      </div>
    </div>
  );

/* ══════════════════════════════════════════════════════════════════════════
   5f. KLANG — Radarschleife und Musik.

   Der Radarton ist eine echte Aufnahme, eingebettet als data-URI. Die Musik
   dagegen wird zur Laufzeit erzeugt: zwei tiefe Oszillatoren, ein Puls und ein
   Streichton, deren Lautstärke und Tempo sich nach der Restzeit richten. Das
   spart eine zweite große Datei und lässt die Musik auf die Lage reagieren,
   statt stumpf im Kreis zu laufen.

   Browser starten Ton erst nach einer Nutzeraktion. Der Klang beginnt deshalb
   mit dem Klick auf "Lagezentrum betreten", nicht beim Laden.
   ══════════════════════════════════════════════════════════════════════════ */

const KLANG = {
  radarLautstaerke: 0.42,
  musikLautstaerke: 0.30,

  // Grundton und Quinte. Tief genug, um zu tragen, ohne die Sprache zu decken.
  grundton: 55,          // A1
  quinte: 82.4,          // E2
  verstimmung: 0.6,      // Schwebung in Hz, macht den Drone lebendig

  // Der Puls wird schneller, je weniger Zeit bleibt.
  pulsLangsam: 2.4,      // Sekunden zwischen zwei Schlägen bei voller Zeit
  pulsSchnell: 0.75,     // ... und kurz vor dem Einschlag
  pulsTon: 41.2,         // E1

  // Ein hoher, schwebender Ton, der erst in der Schlussphase dazukommt.
  spannungAb: 600,       // Restsekunden, ab denen er einsetzt
  spannungTon: 233.1,    // Bb3 — kleine Sekunde über der Quinte, bewusst reibend
  alarmTon: 246.9,       // H3, noch enger am Grundton

  anstiegSekunden: 2.5,  // wie sanft die Musik einblendet
};

/**
 * Baut die Klangschicht einmal auf und hält sie in einem Ref. Alles, was sich
 * mit der Lage ändert, wird über Parameterrampen gesteuert — es werden keine
 * Knoten neu erzeugt, solange das Spiel läuft.
 */
function klangAufbauen() {
  const AudioKlasse = window.AudioContext || window.webkitAudioContext;
  if (!AudioKlasse) return null;
  const ctx = new AudioKlasse();

  const summe = ctx.createGain();
  summe.gain.value = 0;
  summe.connect(ctx.destination);

  // Zwei leicht verstimmte Oszillatoren auf Grundton und Quinte.
  const drone = ctx.createGain();
  drone.gain.value = 0.5;
  drone.connect(summe);
  const stimmen = [];
  for (const [f, pegel] of [
    [KLANG.grundton, 0.5],
    [KLANG.grundton + KLANG.verstimmung, 0.4],
    [KLANG.quinte, 0.26],
  ]) {
    const o = ctx.createOscillator();
    o.type = "sawtooth";
    o.frequency.value = f;
    const g = ctx.createGain();
    g.gain.value = pegel;
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 260;
    o.connect(g).connect(filter).connect(drone);
    o.start();
    stimmen.push({ o, g, filter });
  }

  // Der reibende Spannungston, zunächst stumm.
  const spannung = ctx.createGain();
  spannung.gain.value = 0;
  spannung.connect(summe);
  const spannungOsz = ctx.createOscillator();
  spannungOsz.type = "triangle";
  spannungOsz.frequency.value = KLANG.spannungTon;
  const spannungFilter = ctx.createBiquadFilter();
  spannungFilter.type = "lowpass";
  spannungFilter.frequency.value = 900;
  spannungOsz.connect(spannungFilter).connect(spannung);
  spannungOsz.start();

  // Der Puls: ein kurzer, tiefer Schlag in regelmäßigem Abstand.
  const puls = ctx.createGain();
  puls.gain.value = 0.9;
  puls.connect(summe);

  return {
    ctx,
    summe,
    drone,
    stimmen,
    spannung,
    spannungOsz,
    puls,
    naechsterSchlag: 0,
    laeuft: false,
  };
}

/** Ein Pulsschlag: kurzer Sinus mit schnellem Abfall. */
function pulsSchlagen(k, zeit, staerke) {
  const o = k.ctx.createOscillator();
  const g = k.ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(KLANG.pulsTon * 1.5, zeit);
  o.frequency.exponentialRampToValueAtTime(KLANG.pulsTon, zeit + 0.09);
  g.gain.setValueAtTime(0, zeit);
  g.gain.linearRampToValueAtTime(staerke, zeit + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0008, zeit + 0.55);
  o.connect(g).connect(k.puls);
  o.start(zeit);
  o.stop(zeit + 0.6);
}

/**
 * Passt die Musik an die Lage an. anteil geht von 0 (voller Zeitvorrat) bis 1
 * (Einschlag), dazu kommt die Bereitschaftsstufe.
 */
function klangAnpassen(k, anteil, defcon, phase) {
  if (!k || !k.laeuft) return;
  const t = k.ctx.currentTime;
  const eng = klemme(anteil, 0, 1);

  // Der Drone wird nach vorn hin heller und lauter.
  for (const s of k.stimmen) {
    s.filter.frequency.linearRampToValueAtTime(260 + eng * 420, t + 1.5);
  }
  k.drone.gain.linearRampToValueAtTime(0.42 + eng * 0.3, t + 1.5);

  // Der reibende Ton kommt in der Schlussphase dazu, bei DEFCON 1-2 früher.
  const schwelle = defcon <= 2 ? 0.55 : 0.72;
  const spannungsPegel = eng > schwelle ? (eng - schwelle) / (1 - schwelle) : 0;
  k.spannung.gain.linearRampToValueAtTime(spannungsPegel * 0.16, t + 2);
  k.spannungOsz.frequency.linearRampToValueAtTime(
    defcon <= 2 ? KLANG.alarmTon : KLANG.spannungTon,
    t + 2
  );

  // In der Vergeltungsphase bleibt es tief und ohne Puls — es ist nichts mehr
  // im Anflug, worauf ein Countdown zählen könnte.
  k.pulsAus = phase === "VERGELTUNG";
}

/** Wird pro Bild aufgerufen und setzt fällige Pulsschläge. */
function klangTakten(k, anteil) {
  if (!k || !k.laeuft || k.pulsAus) return;
  const jetzt = k.ctx.currentTime;
  if (jetzt < k.naechsterSchlag) return;
  const eng = klemme(anteil, 0, 1);
  const abstand = KLANG.pulsLangsam + (KLANG.pulsSchnell - KLANG.pulsLangsam) * eng;
  const staerke = 0.35 + eng * 0.5;
  const zeit = Math.max(jetzt, k.naechsterSchlag || jetzt);
  pulsSchlagen(k, zeit, staerke);
  k.naechsterSchlag = zeit + abstand;
}

/**
 * Hält Radarschleife und Musik am Leben. Gibt einen Schalter zurück, mit dem
 * sich alles stummschalten lässt.
 */
function useKlang(z, an) {
  const radar = useRef(null);
  const musik = useRef(null);
  const laeuft = z.phase === "KRISE" || z.phase === "VERGELTUNG";

  // Radar: eine gewöhnliche Audioschleife.
  useEffect(() => {
    if (!radar.current) {
      const a = new Audio(RADARTON);
      a.loop = true;
      a.volume = KLANG.radarLautstaerke;
      radar.current = a;
    }
    const a = radar.current;
    if (an && laeuft && !z.pausiert) {
      a.play().catch(() => {});
    } else {
      a.pause();
    }
  }, [an, laeuft, z.pausiert]);

  // Musik: aufbauen, sobald sie zum ersten Mal gebraucht wird.
  useEffect(() => {
    if (!an || !laeuft) {
      const k = musik.current;
      if (k && k.laeuft) {
        k.summe.gain.linearRampToValueAtTime(0, k.ctx.currentTime + 0.6);
        k.laeuft = false;
      }
      return;
    }
    if (!musik.current) musik.current = klangAufbauen();
    const k = musik.current;
    if (!k) return;
    if (k.ctx.state === "suspended") k.ctx.resume().catch(() => {});
    if (!k.laeuft) {
      k.laeuft = true;
      k.naechsterSchlag = k.ctx.currentTime + 0.4;
      k.summe.gain.cancelScheduledValues(k.ctx.currentTime);
      k.summe.gain.setValueAtTime(k.summe.gain.value, k.ctx.currentTime);
      k.summe.gain.linearRampToValueAtTime(
        KLANG.musikLautstaerke,
        k.ctx.currentTime + KLANG.anstiegSekunden
      );
    }
  }, [an, laeuft]);

  // Lage an die Musik weitergeben.
  const anteil = laeuft ? 1 - z.rest / (z.flugzeit || BALANCE.zeit.flugzeitSekunden) : 1;
  useEffect(() => {
    klangAnpassen(musik.current, anteil, z.defcon, z.phase);
  }, [Math.round(anteil * 20), z.defcon, z.phase]);

  // Pulsschläge takten.
  useEffect(() => {
    if (!an || !laeuft || z.pausiert) return;
    const id = setInterval(() => klangTakten(musik.current, anteil), 120);
    return () => clearInterval(id);
  }, [an, laeuft, z.pausiert, Math.round(anteil * 20)]);

  // Beim Verlassen alles abschalten.
  useEffect(() => {
    return () => {
      if (radar.current) radar.current.pause();
      const k = musik.current;
      if (k) {
        try {
          k.ctx.close();
        } catch (e) {
          /* schon geschlossen */
        }
      }
    };
  }, []);
}

/* ══════════════════════════════════════════════════════════════════════════
   5c. BEDIENUNG — Gesprächsfenster, Notizblock, Anordnungen, Ansichten.
   ══════════════════════════════════════════════════════════════════════════ */

const STIMMUNGSTEXT = {
  RUHIG: "gefasst",
  ANGESPANNT: "angespannt",
  SCHROFF: "kurz angebunden",
  ZWEIFELND: "offen zweifelnd",
};

function Gespraechsfenster({ z, beraterId, onFrage }) {
  const b = BERATER.find((x) => x.id === beraterId);
  const [eingabe, setEingabe] = useState("");
  const verlaufEnde = useRef(null);
  const verlauf = z.gespraeche[beraterId] || [];
  const vorschlaege = frageVorschlaege(z, beraterId);

  useEffect(() => {
    if (verlaufEnde.current) verlaufEnde.current.scrollIntoView({ block: "end" });
  }, [verlauf.length]);

  if (!b) return null;

  function absenden() {
    const text = eingabe.trim();
    if (!text) return;
    setEingabe("");
    onFrage(beraterId, text, null);
  }

  return (
    <div className="flex h-full flex-col">
      <div className="min-h-0 flex-1 overflow-y-auto px-3 py-2">
        {verlauf.length === 0 && (
          <p className="max-w-[62ch] text-[12px] leading-relaxed text-stone-600">
            {b.name.split(" ").slice(-1)[0]} sieht auf. Fragen Sie etwas, oder wählen Sie unten eine Frage.
          </p>
        )}
        <div className="flex flex-col gap-2.5">
          {verlauf.map((e, i) => (
            <div key={i} className="flex flex-col gap-0.5">
              <div className="text-[11px] text-stone-500">— {e.frage}</div>
              <p className="max-w-[62ch] text-[13px] leading-relaxed text-amber-100">{e.antwort}</p>
            </div>
          ))}
          <div ref={verlaufEnde} />
        </div>
      </div>

      <div className="shrink-0 border-t border-stone-800 px-3 py-2">
        <div className="mb-1.5 flex flex-wrap gap-1">
          {vorschlaege.map((t) => (
            <button
              key={t.id}
              onClick={() => onFrage(beraterId, t.frage, t.id)}
              className="border border-stone-800 px-1.5 py-0.5 text-left text-[11px] text-stone-400 hover:border-amber-800 hover:text-amber-300 focus:outline-none focus:ring-1 focus:ring-amber-600"
            >
              {t.frage}
            </button>
          ))}
        </div>
        <div className="flex gap-2">
          <input
            value={eingabe}
            onChange={(e) => setEingabe(e.target.value)}
            onKeyDown={(e) => {
              if (e.key === "Enter") absenden();
            }}
            placeholder="Eigene Frage stellen …"
            className="min-w-0 flex-1 border border-stone-800 bg-stone-950 px-2 py-1 text-[12px] text-stone-200 placeholder:text-stone-700 focus:border-amber-800 focus:outline-none"
          />
          <button
            onClick={absenden}
            className="shrink-0 border border-stone-700 px-2 py-1 text-[11px] tracking-widest text-stone-300 hover:border-amber-700 hover:text-amber-300 focus:outline-none focus:ring-1 focus:ring-amber-600"
          >
            FRAGEN
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── Unterer Bereich: zeigt, was auf dem Terminal angewählt wurde ─────── */

function Anzeigeflaeche({ z, feld }) {
  if (feld.id === "STIMMUNG") {
    return (
      <div className="grid grid-cols-2 gap-x-4 gap-y-2 px-3 py-2">
        {BERATER.map((b) => {
          const w = z.berater[b.id];
          if (!w) return null;
          const kritisch = w.loyalitaet < BALANCE.berater.zweifelAb;
          const schroff = !kritisch && w.loyalitaet < BALANCE.berater.schroffAb;
          return (
            <div key={b.id} className="flex flex-col gap-0.5">
              <div className="flex items-baseline justify-between gap-2">
                <span className={"text-[11px] tracking-wider " + (kritisch ? "text-red-500" : "text-amber-600")}>
                  {b.kuerzel}
                </span>
                <span className="text-[10px] tracking-wider">
                  {kritisch ? (
                    <span className="text-red-500">ZWEIFEL</span>
                  ) : schroff ? (
                    <span className="text-amber-700">SCHROFF</span>
                  ) : (
                    <span className="text-stone-600">
                      {w.uebergangen > 0 ? w.uebergangen + "\u00d7 ÜBERGANGEN" : "GEFASST"}
                    </span>
                  )}
                </span>
              </div>
              <Wertzeile
                beschriftung="LOYALITÄT"
                wert={Math.round(w.loyalitaet)}
                anteil={w.loyalitaet / 100}
                farbe={kritisch ? "bg-red-600" : "bg-amber-600"}
              />
              <Wertzeile beschriftung="VERTRAUEN" wert={Math.round(w.vertrauen)} anteil={w.vertrauen / 100} />
            </div>
          );
        })}
      </div>
    );
  }

  if (feld.id === "SENSOREN") {
    return (
      <div className="grid grid-cols-1 gap-x-4 gap-y-0.5 px-3 py-2">
        {sensorlageZeilen(z).map((s) => (
          <div
            key={s.name}
            className="flex items-baseline justify-between gap-3 border-b border-stone-900 py-0.5 text-[11px]"
          >
            <span className="tracking-wider text-stone-500">{s.name}</span>
            <span className={"tracking-wider " + s.farbe}>{s.wert}</span>
          </div>
        ))}
      </div>
    );
  }

  return (
    <div className="px-4 py-3">
      {z.zeitleiste.length === 0 && (
        <div className="text-[11px] text-stone-600">Noch nichts angeordnet.</div>
      )}
      {z.zeitleiste.map((e, i) => (
        <div key={i} className="grid grid-cols-[4.5rem_1fr] gap-2 text-[11px] leading-6">
          <span className="tabular-nums text-stone-600">{e.uhrzeit}</span>
          <span className="text-stone-300">{e.text}</span>
        </div>
      ))}
    </div>
  );
}

function Aktionsflaeche({ z, kategorie, onAktion }) {
  const [bestaetige, setBestaetige] = useState(null);
  useEffect(() => {
    setBestaetige(null);
  }, [z.laufend, kategorie]);

  const inKategorie = AKTIONEN.filter((a) => a.kategorie === kategorie && a.phasen.includes(z.phase));
  if (!inKategorie.length) {
    return (
      <div className="px-4 py-3 text-[11px] text-stone-600">
        In dieser Phase gibt es hier nichts anzuordnen.
      </div>
    );
  }

  return (
    <div className="grid grid-cols-1 gap-px bg-stone-800">
      {inKategorie.map((a) => {
        const nutzbar = aktionVerfuegbar(z, a);
        const wartet = bestaetige === a.id;
        return (
          <button
            key={a.id}
            disabled={!nutzbar}
            onClick={() => {
              if (a.kritisch && !wartet) {
                setBestaetige(a.id);
                return;
              }
              setBestaetige(null);
              onAktion(a.id);
            }}
            className={
              "flex flex-col gap-0.5 bg-stone-950 px-3 py-1.5 text-left transition-colors focus:outline-none focus:ring-1 " +
              (!nutzbar
                ? "cursor-not-allowed opacity-25"
                : wartet
                ? "bg-red-950 ring-1 ring-red-700 focus:ring-red-500"
                : a.kritisch
                ? "hover:bg-red-950 focus:ring-red-600"
                : "hover:bg-stone-900 focus:ring-amber-600")
            }
          >
            <div className="flex items-baseline justify-between gap-2">
              <span
                className={
                  "text-[12px] tracking-wide " +
                  (wartet ? "text-red-300" : a.kritisch ? "text-red-400" : "text-stone-200")
                }
              >
                {wartet ? "BESTÄTIGEN: " + a.titel : a.titel}
              </span>
              <span className="shrink-0 text-[11px] tabular-nums text-stone-600">
                {zeitText(BALANCE.aktionskosten[a.id])}
              </span>
            </div>
            <span className="text-[10px] leading-snug text-stone-600">
              {wartet ? "Erneut anklicken. Danach gibt es keinen Weg zurück." : a.beschreibung}
            </span>
          </button>
        );
      })}
    </div>
  );
}

/* ── Hauptkomponente ───────────────────────────────────────────────────── */

function Krisenstab() {
  const [z, dispatch] = useReducer(reduzieren, undefined, anfangszustand);
  const [fenster, setFenster] = useState([]);
  const [zaehler, setZaehler] = useState(1);
  const [fortschritt, setFortschritt] = useState(fortschrittLesen);
  const [ton, setTon] = useState(true);
  const gebucht = useRef(null);
  const buehne = useRef(null);

  const laeuft = z.phase === "KRISE" || z.phase === "VERGELTUNG";
  useKlang(z, ton);

  // Jeder abgeschlossene Durchlauf wird genau einmal vermerkt.
  useEffect(() => {
    if (z.phase !== "ENDE" || !z.ende) return;
    const kennung = z.seedText + ":" + z.ende + ":" + z.verstrichen;
    if (gebucht.current === kennung) return;
    gebucht.current = kennung;
    setFortschritt((alt) => fortschrittSchreiben(alt, z));
  }, [z.phase, z.ende]);
  useEffect(() => {
    if (!laeuft || z.pausiert) return;
    const ms = BALANCE.zeit.tickMs;
    const id = setInterval(() => dispatch({ typ: "TICK", realSekunden: ms / 1000 }), ms);
    return () => clearInterval(id);
  }, [laeuft, z.pausiert]);

  function masse() {
    const el = buehne.current;
    return el ? { breite: el.clientWidth, hoehe: el.clientHeight } : { breite: 1000, hoehe: 700 };
  }

  /** Öffnet ein Fenster — oder holt es nach vorn, wenn es schon offen ist. */
  function oeffnen(id, titel, art, daten, untertitel) {
    setFenster((alt) => {
      const da = alt.find((f) => f.id === id);
      const z2 = zaehler + 1;
      setZaehler(z2);
      if (da) return alt.map((f) => (f.id === id ? { ...f, z: z2, daten } : f));
      const g = FENSTERGROESSE[art] || FENSTERGROESSE.ANZEIGE;
      const p = startPosition(alt.length, g, masse());
      return [...alt, { id, titel, untertitel, art, daten, z: z2, breite: g.breite, hoehe: g.hoehe, ...p }];
    });
  }
  const schliessen = (id) => setFenster((alt) => alt.filter((f) => f.id !== id));
  const fokussieren = (id) =>
    setFenster((alt) => {
      const z2 = zaehler + 1;
      setZaehler(z2);
      return alt.map((f) => (f.id === id ? { ...f, z: z2 } : f));
    });
  const bewegen = (id, pos) =>
    setFenster((alt) => alt.map((f) => (f.id === id ? { ...f, x: pos.x, y: pos.y } : f)));

  function beiFigur(beraterId) {
    const b = BERATER.find((x) => x.id === beraterId);
    dispatch({ typ: "ANSICHT", ansicht: "GESPRAECH", beraterId });
    oeffnen("gespraech-" + beraterId, b.name, "GESPRAECH", { beraterId }, b.rolle);
  }

  function beiGegenstand(id) {
    if (id === "NOTIZBLOCK") oeffnen("notizbuch", "Notizbuch", "NOTIZBUCH", {});
    else if (id === "TELEFON") dispatch({ typ: "AKTION", id: "DRAHT" });
  }

  function beiFeld(f) {
    oeffnen(
      "feld-" + f.id,
      f.aufschrift,
      f.art === "AKTIONEN" ? "ANORDNUNGEN" : "ANZEIGE",
      { feld: f },
      f.inhalt
    );
  }

  /** Ein Startbefehl geht nur mit gewähltem Ziel hinaus. */
  function beiAktion(id) {
    if ((id === "START_VOLL" || id === "START_BEGRENZT") && !z.ziel) {
      oeffnen(
        "zielauswahl",
        "Zielfestlegung",
        "ZIELAUSWAHL",
        { umfang: id === "START_VOLL" ? "VOLL" : "BEGRENZT" },
        id === "START_VOLL" ? "Vollständiger Gegenschlag" : "Begrenzter Gegenschlag"
      );
      return;
    }
    dispatch({ typ: "AKTION", id });
  }

  return (
    <div className="min-h-screen bg-stone-950 font-mono text-stone-300 antialiased">
      {z.phase === "BRIEFING" && (
        <Briefing onStart={(seedText, tempo) => dispatch({ typ: "START", seedText, tempo })} />
      )}

      {laeuft && (
        <div className="flex h-screen flex-col">
          <Kopfzeile
            z={z}
            onPause={() => dispatch({ typ: "PAUSE" })}
            onNeustart={() => { setFenster([]); dispatch({ typ: "NEUSTART" }); }}
            ton={ton}
            onTon={() => setTon((t) => !t)}
            offeneFenster={fenster.length}
            onAlleSchliessen={() => setFenster([])}
          />
          <div ref={buehne} className="relative flex min-h-0 flex-1 flex-col">
            <RaumSzene
              z={z}
              aktivesFeld={null}
              onFigur={beiFigur}
              onGegenstand={beiGegenstand}
              onFeld={beiFeld}
            />

            {fenster.map((f) => {
              const obenauf = f.z === Math.max(...fenster.map((x) => x.z));
              return (
                <Fenster
                  key={f.id}
                  f={f}
                  obenauf={obenauf}
                  onSchliessen={schliessen}
                  onFokus={fokussieren}
                  onBewegen={bewegen}
                  kinder={
                    f.art === "GESPRAECH" ? (
                      <Gespraechsfenster
                        z={z}
                        beraterId={f.daten.beraterId}
                        onFrage={(beraterId, eingabe, themaId) =>
                          dispatch({ typ: "FRAGE", beraterId, eingabe, themaId })
                        }
                      />
                    ) : f.art === "NOTIZBUCH" ? (
                      <Notizbuch z={z} onNotiz={(text) => dispatch({ typ: "NOTIZ", text })} />
                    ) : f.art === "ZIELAUSWAHL" ? (
                      <Zielauswahl
                        z={z}
                        umfang={f.daten.umfang}
                        onAbbrechen={() => schliessen(f.id)}
                        onBestaetigen={(land, art) => {
                          dispatch({ typ: "ZIEL", land, art });
                          dispatch({
                            typ: "AKTION",
                            id: f.daten.umfang === "VOLL" ? "START_VOLL" : "START_BEGRENZT",
                          });
                          schliessen(f.id);
                        }}
                      />
                    ) : f.art === "ANORDNUNGEN" ? (
                      <Aktionsflaeche z={z} kategorie={f.daten.feld.id} onAktion={beiAktion} />
                    ) : (
                      <Anzeigeflaeche z={z} feld={f.daten.feld} />
                    )
                  }
                />
              );
            })}

            {z.laufend && (
              <div className="pointer-events-none absolute bottom-2 left-1/2 z-50 -translate-x-1/2 border border-amber-900 bg-stone-950/95 px-3 py-1.5">
                <span className="text-[11px] tracking-widest text-amber-500">
                  {(AKTIONEN.find((a) => a.id === z.laufend.id) || {}).titel}
                </span>
                <span className="ml-3 text-[11px] tabular-nums text-stone-400">
                  NOCH {zeitText(z.laufend.rest)}
                </span>
              </div>
            )}
          </div>
        </div>
      )}

      {z.phase === "ENDE" && (
        <Nachspann z={z} fortschritt={fortschritt} onNeustart={() => dispatch({ typ: "NEUSTART" })} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Krisenstab));
</script>
